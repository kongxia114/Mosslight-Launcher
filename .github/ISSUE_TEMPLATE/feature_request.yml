name: ✨ 功能请求 (Feature Request)
description: 为这个项目提出一个新想法 / Suggest an idea for this project
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你为 Mosslight Launcher 提出建议！
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前检查 (Pre-flight Checklist)
      options:
        - label: 我已经搜索了现有的 Issues，确认这是一个新的需求。
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 你的功能请求是否与某个问题相关？ (Is your feature request related to a problem?)
      description: 请清晰简明地描述问题是什么。
      placeholder: 比如：每次我在做 xxx 的时候，总是需要手动点击，让我觉得很繁琐...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 你期望的解决方案 (Describe the solution you'd like)
      description: 请描述你希望发生什么。
      placeholder: 比如：希望能在设置里加一个开关，自动实现 xxx 功能。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案 (Describe alternatives you've considered)
      description: 描述你考虑过的任何替代解决方案或功能。
    validations:
      required: false
