name: Bot Auto Commit

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  bot-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Build Info
        run: |
          mkdir -p .github
          echo "Last automated build by GitHub Actions: $(date -u)" > .github/BUILD_INFO.txt
          echo "Random token: $RANDOM" >> .github/BUILD_INFO.txt

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add .github/BUILD_INFO.txt
          git commit -m "chore: auto update build info [skip ci]" || exit 0
          git push
