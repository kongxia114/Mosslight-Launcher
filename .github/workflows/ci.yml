# ============================================================================
#  日常 CI：每次 push / PR 都跑一遍"能不能编、自检过不过、界面起不起得来"
#
#  这一份**不发 Release**，纯粹是门禁 —— 目的是让问题在推 tag *之前* 就暴露，
#  而不是等到发版那天才发现自检红了。
#
#  跟 release.yml 的区别只有最后几步（不 publish 两个包、不打包、不建 Release），
#  前面的构建 + 自检 + 界面冒烟是同一套。改了一边记得同步另一边。
#
#  ⚠️ 唯一**故意不同构**的地方：release.yml 出**两个**包（框架依赖的小包 +
#     自带运行时的大包），而 ci 的"试发布"**只试小包**。理由写在
#     `试发布一次` 那一步的注释里（一句话：两个包是同一条代码路径，
#     多试一个大包只是多花几分钟；真要两个都试，照抄 release.yml 的循环即可）。
# ============================================================================

name: CI

on:
  push:
    branches: ['**']
    # tag 走 release.yml，这里不用重复跑（那份跑得更全）
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

# CI 只读仓库就够了 —— **不要**给 contents: write：
# PR 来的代码不该有写权限。
permissions:
  contents: read

# 同一个分支连着推几次时，把前一次还没跑完的取消掉，省 runner
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  # 界面冒烟的页面清单 —— 跟 release.yml 里那份**必须一致**。
  #
  # 为什么要有这个变量：这张表原来是手写在 `foreach ($page in ...)` 里的，两个
  # 工作流各一份。工程这几轮一直在加页面/子段（logwindow / settings:aboutdialog /
  # personalize:anim / download:mods / mods:detail …），两份清单必然有一份先过期 ——
  # 而"清单过期"的表现是"新页面永远没被截过"，门禁照样绿，等于白门禁。
  # 放在这里至少一眼能看见全貌，改的时候也知道该同步哪边。
  #
  # ⚠️ **顺序有讲究，别按字母排**：`versionsettings:modsloader` 要挑一个"带加载器
  #    的版本"（得在游戏目录还没被动过时跑）；`versions:emptydir` 会把
  #    `minecraft_dir` 写进配置指向一个不存在的目录，之后的页全变成"空目录那一屏"；
  #    `versions:activate` 会切回启动页。所以这三条按
  #    modsloader → emptydir → activate 排在最后。
  SMOKE_PAGES: >-
    home personalize accounts settings versions versionsettings mods download
    logwindow downloadwindow
    settings:java settings:memory settings:download settings:other settings:about settings:aboutdialog
    personalize:anim
    download:loader download:loader:forge download:modpack download:modpacks download:mods
    download:resourcepacks download:shaders download:datapacks download:worlds download:favorites
    mods:detail
    mods:target
    versions:filter:loader versions:filter:pack
    versionsettings:launch versionsettings:memory versionsettings:server
    versionsettings:advanced versionsettings:mods versionsettings:modsloader
    versions:emptydir
    versions:activate

jobs:
  check:
    runs-on: windows-latest

    # 卡住就别干等（GitHub 默认 360 分钟）。这一步没有 release 那么重，
    # 但逐页截图 + 一次试发布也要好几分钟 —— 试发布现在**只试小包**
    # （框架依赖那个，见下面那一步的注释），比原来试 self-contained 快得多。
    timeout-minutes: 30

    steps:
      - name: 取源码
        uses: actions/checkout@v4

      # ⚠️ **钉到具体版本，不写 `10.0.x`**（2026-10-18 踩过）：
      #    范围版本会让 setup-dotnet 先去拉版本清单再解析 —— runner 网络一慢就
      #    长时间停在「装 .NET SDK」不动，从外面看像"推送炸了"，
      #    其实是它没报错、在等下几百 MB 的 SDK。
      #    钉死之后直接下这一个包，而且**跟开发机同一个 SDK**（本地就是 10.0.401）。
      # ⚠️ `timeout-minutes` 是**必需的兜底**：不设的话这一步能挂到 job 的 6 小时上限，
      #    期间界面一直显示"进行中"，既不红也不绿。设了之后卡住就当场失败，
      #    报错里写明是这一步超时 —— 一眼能看出该重跑还是该查网络。
      - name: 装 .NET SDK
        uses: actions/setup-dotnet@v4
        timeout-minutes: 15
        with:
          dotnet-version: '10.0.401'

      # ⚠️ 显式 `shell: pwsh`（跟别的步骤一致）：runner 上默认本来就是 pwsh，
      #    但"默认"这件事不该靠记 —— 5.1 和 7 在编码/重定向上有实打实的差别。
      - name: 环境信息
        shell: pwsh
        run: dotnet --info

      # 缓存 NuGet 包目录。这个工程**一个包都不引**，所以缓存基本是空转，
      # 但 setup-dotnet 之后恢复一次只要一两秒，留着以后真要引包时不用再改。
      #
      # ⚠️ key 里的 hashFiles 把 **.csproj / .slnx** 都算进去了，所以
      #    Mosslight.Core 改了 csproj（比如加了个 PackageReference）缓存就会失效——
      #    这一点是对的。但**改 .cs 源码不会**让这个 key 变（也不该变）：
      #    缓存的是"包"，不是"编译产物"。而且 `dotnet restore` 每次都会跑，
      #    缓存命中与否只影响快慢，不影响正确性。
      - name: 缓存 NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: 还原
        run: dotnet restore "Mosslight-Launcher 2.0.slnx" -m:1

      # 跟 release.yml 一样用 -warnaserror：这个工程目前是 0 警告，
      # 让它保持住比事后回来清理便宜得多。
      - name: 构建
        run: dotnet build "Mosslight-Launcher 2.0.slnx" -c Release --no-restore -m:1 -warnaserror

      # 发行说明：Release 正文是**从 CHANGELOG.md 里抠出来的**，抠不到不会报错 ——
      # Release 页面只会静静地显示一句"没有在 CHANGELOG.md 里找到对应小节的说明"。
      # 2026-10 之前六次发版全是那句，没人发现，所以这一条得有人盯着：
      # 下面的脚本把 release.yml 的「组装发行说明」抽出来，在**临时 git 仓库里真跑一遍**
      # （三种情形：有小节 / 只有空的「未发布」/ 根本没有 CHANGELOG），
      # 顺手验仓库里**那份真的** CHANGELOG.md 结构对不对、能不能回退到「未发布」。
      #
      # ⚠️ 不联网也能跑：它只吃仓库里的文件 + 本地 git。
      - name: 发行说明（CHANGELOG + 兜底正文）
        shell: pwsh
        run: |
          python -c "import yaml" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "（缺 pyyaml，装一下）"
            python -m pip install --disable-pip-version-check --quiet pyyaml
          }
          python tools\check_release_body.py
          if ($LASTEXITCODE -ne 0) { throw "发行说明自检没过（退出码 $LASTEXITCODE）" }

      # 金标准和 fixture 都在仓库里，不需要 Python、不需要联网
      - name: 自检（离线金标准比对）
        shell: pwsh
        run: |
          $exe = 'Mosslight.Core.SelfCheck\bin\Release\net10.0-windows\Mosslight.Core.SelfCheck.exe'
          if (-not (Test-Path $exe)) { throw "自检没编出来：$exe" }
          & $exe 'tests\theme_golden.json'
          if ($LASTEXITCODE -ne 0) { throw "自检没过（退出码 $LASTEXITCODE）" }

      # XAML / 样式表 / 标记扩展的错误编译期抓不到，只有真建一次窗口才现形。
      #
      # ⚠️ **每一页都要截**，不能只截首页 —— 这个门禁是真抓过东西的：
      #    · 账户页外层 Grid 少声明了一行，页脚 `Grid.Row="4"` 越界，
      #      WPF **不报错**、把它塞回最后一行，结果文字叠在标题上；
      #    · 设置页的 `Slider.ValueChanged` 在 XAML **解析期**就触发，
      #      那时后面的 x:Name 控件还没建出来 → 构造期 NullReferenceException。
      #    两个都是"编译 0 警告、跑起来才炸"，而且都不在首页上。
      #
      # ⚠️ 清单在 jobs.<id>.env.SMOKE_PAGES 里（不是写在这儿的字面量）——
      #    加页面时改那一处，同时**记得同步 release.yml 的同名变量**。
      #    判定标准是"截图 > 5000 字节"：1280x820 的正常一屏有几十 KB，
      #    几百字节就是一张白板（页面构造时炸掉、或者根本没渲染出来）。
      - name: 界面冒烟（每页离屏渲染一张截图）
        shell: pwsh
        run: |
          $exe = 'Mosslight.App\bin\Release\net10.0-windows\win-x64\Mosslight.exe'
          if (-not (Test-Path $exe)) { throw "界面没编出来：$exe" }

          $dir = Join-Path $env:RUNNER_TEMP 'smoke'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          $pages = $env:SMOKE_PAGES -split '\s+' | Where-Object { $_ }

          $failed = @()
          foreach ($page in $pages) {
            # ⚠️ 文件名里的 `:` 换成 `-`：Windows 上文件名不能带冒号，
            #    `versionsettings:advanced.png` 会直接建不出来。
            $shot = Join-Path $dir "$($page -replace ':', '-').png"
            $p = Start-Process -FilePath $exe `
                               -ArgumentList '--page',$page,'--screenshot',$shot,'--settle','5000' `
                               -PassThru -Wait
            if ($p.ExitCode -ne 0) { $failed += "$page（退出码 $($p.ExitCode)）"; continue }
            if (-not (Test-Path $shot)) { $failed += "$page（没截出图）"; continue }
            # 一张 1280x820 的正常截图有几十 KB；几百字节说明是白板
            $len = (Get-Item $shot).Length
            if ($len -lt 5000) { $failed += "$page（只有 $len 字节，像白板）"; continue }
            Write-Host "  $page OK：$len 字节"
          }

          # 浮层提示（toast）单独截一张：它只在"点了一下收藏"之后才出现，
          # 逐页截图那条路截不到（页面目录里没有、也不该有它）。
          # 走的是跟真点击同一条 `App.MainWindow.ShowToast`，所以样式 key 缺了、
          # 图标资源没生成、浮层挡住布局，这里都会以非零退出码或无图暴露出来。
          $toastShot = Join-Path $dir 'home-toast.png'
          $toast = Start-Process -FilePath $exe `
                                 -ArgumentList '--page','home','--toast','已加入收藏夹',`
                                               '--screenshot',$toastShot,'--settle','900' `
                                 -PassThru -Wait
          if ($toast.ExitCode -ne 0) {
            $failed += "home+toast（退出码 $($toast.ExitCode)）"
          } elseif (-not (Test-Path $toastShot)) {
            $failed += "home+toast（没截出图）"
          } elseif ((Get-Item $toastShot).Length -lt 5000) {
            $failed += "home+toast（截图太小，像白板）"
          } else {
            Write-Host "  home+toast OK：$((Get-Item $toastShot).Length) 字节"
          }

          if ($failed.Count -gt 0) { throw "这些页面没渲染出来：$($failed -join '、')" }
          "SHOTDIR=$dir" >> $env:GITHUB_ENV

      - name: 留档截图
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: ${{ env.SHOTDIR }}
          retention-days: 7

      # 只看"能不能发布"——不发出去，但能提前发现单文件打包特有的问题
      # （比如某个原生库没被打进去，那是只有 publish 才会暴露的）
      #
      # ⚠️ **这里只试发布一个包，而且试的是小包（框架依赖那个）。**
      #    release.yml 现在出**两个**包（`--self-contained false` 的小包 +
      #    `--self-contained true` 的大包），ci 刻意**只试小包**，理由三条：
      #
      #      1. **快**。大包那份 publish 要把整个 .NET 运行时塞进单文件再压缩，
      #         是这条流水线上最慢的一步（几分钟）；ci 每次 push 都跑，
      #         而"试发布"要抓的问题（散装 dll / 单文件没做成 / 版本号没进去 /
      #         语言数据丢了）**两个包是同一条代码路径**，多跑一个包抓不到新东西。
      #      2. **小包多一层风险，更该在 ci 里盯**。它是框架依赖的，
      #         运行时不在包里；而 `--self-contained false` + `PublishSingleFile`
      #         这个组合（还有"压缩参数不能给它"那条 NETSDK1176）只有它会踩。
      #         大包那条路是**原来唯一那条路**，已经跑了很久、没变过。
      #      3. **真正发版前一定会两个都验**：release.yml 的发布/冒烟/打 zip
      #         三步都是"一张表 + 循环"，两个包走同一段代码各跑一遍。
      #         所以 ci 漏掉的不是"验证"，只是"提前几分钟知道"。
      #
      #    ⚠️ 代价说清楚：**大包独有的问题 ci 抓不到**（比如哪天有人给大包加了个
      #       只对它生效的参数）。这个风险是明知的，换的是 ci 的时长。
      #       真要把两个包都塞进 ci，把下面那段改成跟 release.yml 一样的循环即可。
      #
      # ⚠️ 判据必须跟 release.yml 的 `发布` 那一步**同一套**：
      #    语言文件改成内嵌资源（EmbeddedResource）之后，发布目录顶层应该
      #    **恰好一个 Mosslight.exe**、且**没有 Assets\ 目录**。
      #    这里以前断言的是"`publish\Assets\lang\zh_CN.json` 必须在"，
      #    那正是要干掉的东西 —— 两边不同步的话，CI 会为旧形态放行、
      #    或者为旧形态报假红。
      - name: 试发布一次（只试小包，不发布到 Release）
        shell: pwsh
        run: |
          # ⚠️ `--self-contained false`：跟 release.yml 里"小包"那个包**同一个参数**。
          #    另一处必须跟着一起改的地方：**不能**加
          #    `-p:EnableCompressionInSingleFile=true` —— 框架依赖的单文件 bundle
          #    不支持压缩，加上去是 `error NETSDK1176` 直接失败。
          dotnet publish 'Mosslight.App\Mosslight.App.csproj' `
            -c Release -r win-x64 --self-contained false `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish -m:1
          if ($LASTEXITCODE -ne 0) { throw "发布失败（退出码 $LASTEXITCODE）" }

          # .pdb 不进发布包（跟 release.yml 一致）
          Get-ChildItem publish -Filter *.pdb -Recurse | Remove-Item -Force

          if (Test-Path 'publish\Assets') {
            throw "发布产物里出现了 Assets\ 目录 —— 语言文件应该编进程序集（见 Mosslight.Core.csproj）"
          }
          $topFiles = @(Get-ChildItem publish -File)
          if ($topFiles.Count -ne 1) {
            throw ("发布产物顶层应该**恰好 1 个文件**（Mosslight.exe），实际 $($topFiles.Count) 个：" +
                   (($topFiles | ForEach-Object Name) -join '、'))
          }
          if ($topFiles[0].Name -ne 'Mosslight.exe') {
            throw "发布产物顶层那个文件是 '$($topFiles[0].Name)'，不是 Mosslight.exe"
          }
          Write-Host "发布产物 OK：顶层恰好 1 个文件（Mosslight.exe），无 Assets\ 目录"

          # 语言数据真的编进去了 —— 只在 exe 一个文件的形态下再确认一次
          # （判据跟 release.yml 的单文件冒烟一致）。
          #
          # ⚠️ 必须重定向到**文件**再读，不能写 `& $exe --lang-check | Out-String`：
          #    WPF 工程的 OutputType 是 WinExe，而 `&` 管道读的是"控制台程序的
          #    标准输出"。WinExe 平时没有控制台，输出会**静默丢掉** ——
          #    `$langText` 变成空串、下面的 match 直接失配，看着像"语言数据不对"，
          #    其实是没读到。重定向到文件就没这个问题。
          $langFile = Join-Path $env:RUNNER_TEMP 'langcheck_publish.txt'
          $p = Start-Process -FilePath (Resolve-Path 'publish\Mosslight.exe').Path `
                             -ArgumentList '--lang-check' -PassThru -Wait `
                             -RedirectStandardOutput $langFile
          # 显式按 UTF-8 读：exe 里 Console.OutputEncoding 是 UTF-8，
          # 默认编码解码会把中文变乱码，而乱码只会让 match **静默失配**
          $langText = [System.IO.File]::ReadAllText($langFile, [System.Text.Encoding]::UTF8)
          Get-Content $langFile -Encoding UTF8 | Out-String | Write-Host
          if ($p.ExitCode -ne 0) { throw "publish 出来的 exe 语言数据不对（退出码 $($p.ExitCode)）" }
          if ($langText -notmatch '\[lang\] 结论：全部通过') {
            throw "--lang-check 没报「全部通过」"
          }
