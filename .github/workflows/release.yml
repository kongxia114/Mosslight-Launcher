# ============================================================================
#  发版：出 Release
#
#  两种触发方式：
#
#    1. 推 tag（推荐，版本号跟着 tag 走）
#         git tag v2.0.0 && git push origin v2.0.0
#
#    2. 手动点（Actions → Release → Run workflow，填个版本号）
#         想重发一次、或者从某个分支直接发而不想打 tag 时用
#
#  两种方式跑的是**同一套步骤** —— 刻意没有拆成两个文件：拆开之后
#  "改了 release.yml 忘了改 manual-release.yml"是迟早的事（1.0.0 那边就是两份）。
#
#  产物：**两个 zip**，每个里都**只有一个文件** `Mosslight.exe`（语言数据编在
#        程序集里，所以没有任何要跟着 exe 一起走的目录）。两个包的差别**只有
#        `--self-contained` 这一个发布参数**：
#
#          · 小包（主推）`Mosslight-2.0-<tag>-win64.zip`
#              `--self-contained false`，exe 约 2 MB / zip 约 1.3 MB。
#              要求机器上已经装了 .NET 10 **桌面运行时**；没装的话双击会弹一个
#              Windows 自带的提示框，里面带官方下载链接。
#          · 大包（备用）`Mosslight-2.0-<tag>-win64-selfcontained.zip`
#              `--self-contained true`，exe 约 60 MB / zip 约 55 MB。
#              零依赖，解压双击就跑。
#
#        为什么两个都发：**"下载体积"和"零依赖"没法同时满足** —— 只发大包会让
#        装过运行时的那部分人多下 58 MB，只发小包会把没装运行时的人挡在门外。
#        与其替用户猜，不如两个都放在 Release 里、正文里写清"不确定就下小的"。
#        代价是发布流程要 publish 两次、打两个 zip、验两遍（见下面的打包段）。
# ============================================================================

name: Release

on:
  push:
    tags:
      - 'v*'          # 只匹配 v2.0.0 / v2.0.0-beta 这类 tag

  workflow_dispatch:
    inputs:
      version:
        description: '版本号（必须带 v 前缀，如 v2.0.0）'
        required: true
        # ⚠️ 刻意**不给 default**。1.0.0 那份写死了 'v1.0.0' 当默认值，
        #    还得靠一句注释提醒"每次发版顺手改这两行"—— 手一滑就把上一次的
        #    版本号发出去了。必填 + 空默认，逼着人每次自己敲一遍。
      prerelease:
        description: '标记为预发布版（beta / alpha / rc）'
        type: boolean
        default: false

# ⚠️ 必须给 contents: write，否则创建 Release 会 403。
#    GitHub 从 2023 起把默认 GITHUB_TOKEN 收成了只读，不写这一行就白跑一趟。
permissions:
  contents: write

# 同一个 tag 重复推 / 手动重跑时，别让两个 job 同时改同一个 Release
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  # 关掉 .NET 的"首次运行体验"（Welcome 消息 + 后台遥测）：
  # 不关的话 CI 日志开头会多一大段，首次 dotnet 命令还要多等几秒
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  # 界面冒烟的页面清单 —— **只有这一份**，别在步骤里再抄一遍。
  #
  # 为什么挪到 env：这张表原来是手写在 `foreach ($page in ...)` 里的，而
  # ci.yml 有**一模一样**的另一份。工程这几轮一直在加页面/子段
  # （logwindow / settings:aboutdialog / personalize:anim / download:mods …），
  # 两份清单必然有一份先过期 —— 而"清单过期"的表现是"新页面永远没被截过"，
  # 门禁照样绿，等于白门禁。放在这里至少一眼能看见全貌。
  # ⚠️ 改这里记得同步 ci.yml 的同名变量（两份文件刻意保持同构）。
  #
  # ⚠️ **顺序有讲究，别按字母排**：这几条会**改状态**，必须排在最后 ——
  #    · `versionsettings:modsloader` 要挑一个"带加载器的版本"，前面没人动过
  #      游戏目录时才挑得到；
  #    · `versions:emptydir` 会把 `minecraft_dir` **写进配置**（指向一个不存在的
  #      目录，用来露出「新建 .minecraft 文件夹」那条分支）。它之后的每一页都会
  #      看到"游戏目录是空的" —— 实测排在中间时，后面的 `versionsettings*`
  #      截图全都变成了空目录那一屏，等于没验；
  #    · `versions:activate` 会切回启动页，所以放最后一个 ——
  #      这一条要的就是"真的跳过去了"这个结果。
  SMOKE_PAGES: >-
    home personalize accounts settings versions versionsettings mods download
    logwindow downloadwindow
    settings:java settings:memory settings:download settings:other settings:about settings:aboutdialog
    personalize:anim
    download:loader download:loader:forge download:modpack download:modpacks download:mods
    download:resourcepacks download:shaders download:datapacks download:worlds download:favorites
    mods:detail
    mods:target
    versions:filter:loader versions:filter:pack
    versionsettings:launch versionsettings:memory versionsettings:server
    versionsettings:advanced versionsettings:mods versionsettings:modsloader
    versions:emptydir
    versions:activate

jobs:
  release:
    # ⚠️ 必须是 windows runner：这是 WPF（net10.0-windows），
    #    Linux 容器里连编译都过不去。
    runs-on: windows-latest

    # 卡住就别干等：GitHub 默认 360 分钟，而 release 有 concurrency
    # （cancel-in-progress: false），一个挂死的 job 会把后面排队的一次发版一起堵住。
    # 30 分钟对这套步骤（构建 + 逐页截图 + 60MB 打包）已经非常宽松了。
    timeout-minutes: 30

    steps:
      # ⚠️ fetch-depth: 0 是必须的。默认只拉 1 个提交**且不带 tag**，
      #    而发行说明最后要 `git describe` 找上一个 tag 来生成 compare 链接 ——
      #    浅克隆下那个命令会失败，链接就没了（不报错，只是悄悄少一行）。
      - name: 取源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ⚠️ **钉到具体版本，不写 `10.0.x`**（2026-10-18 踩过）：
      #    范围版本会让 setup-dotnet 先去拉版本清单再解析 —— runner 网络一慢就
      #    长时间停在「装 .NET SDK」不动。当时那次 Release 就是卡在这一步：
      #    状态一直是 in_progress、既不红也不绿（从外面看像"推送炸了"）。
      #    钉死之后直接下这一个包，而且**跟开发机同一个 SDK**（本地就是 10.0.401）。
      # ⚠️ `timeout-minutes` 是**必需的兜底**：不设的话它能挂到 job 的 30 分钟上限，
      #    期间日志一片安静。设了之后卡住就当场失败、报错点名是这一步超时。
      - name: 装 .NET SDK
        uses: actions/setup-dotnet@v4
        timeout-minutes: 15
        with:
          dotnet-version: '10.0.401'

      # 出问题时这一屏信息最值钱（SDK 版本、装了哪些 runtime）
      - name: 环境信息
        run: dotnet --info

      # ----------------------------------------------------------------------
      #  版本号：**以 tag（或手动输入）为准**，不认源码里写死的那个
      # ----------------------------------------------------------------------
      - name: 归一化版本号
        id: ver
        # ⚠️ `shell: pwsh` 不能省，也不能改成 `powershell`。
        #    下面用 `>> $env:GITHUB_OUTPUT` 传值：PowerShell 7 的 `>>` 写 UTF-8，
        #    而 Windows PowerShell 5.1 的 `>>` 默认写 **UTF-16LE** ——
        #    GitHub 按 UTF-8 去读就会解析不出任何 output（而且是静默的，
        #    下一步只会看到空字符串）。凡是要写 GITHUB_OUTPUT/GITHUB_ENV 的
        #    步骤，都必须显式声明 pwsh。
        shell: pwsh
        run: |
          # 所有 GitHub 表达式插值（写法是美元号 + 双层花括号）都套上单引号：
          # 手动 dispatch 时 inputs.version 是**人敲的**，
          # 不加引号会被当成 PowerShell 代码拼进脚本体里（带空格/引号就直接语法错）。
          #
          # ⚠️ 这段注释里**绝对不能写出那个空表达式本身**（美元号紧跟两层花括号）：
          #    `run:` 块里的注释也是脚本文本的一部分，GitHub 会把它当**真表达式**去求值，
          #    空表达式会让整个工作流在解析阶段就被判为 "Invalid workflow file /
          #    An expression was expected" —— 一个步骤都跑不起来，而且报的行号指向
          #    块标量开头，肉眼根本看不出是注释的锅（2026-10 真踩过）。
          $isManual = '${{ github.event_name }}' -eq 'workflow_dispatch'
          $tag = if ($isManual) { '${{ inputs.version }}'.Trim() } else { '${{ github.ref_name }}' }

          if (-not $tag) { throw "版本号是空的。" }
          # `-p:Version=` 要的是合法版本号，不能带前缀的 v；
          # 而 Release 名字和 zip 文件名沿用带 v 的 tag（跟 1.0.0 的产物命名一致）。
          $num = $tag -replace '^v', ''

          # ⚠️ 这里**必须**逐字符卡死，不能只写 `^\d+\.\d+`（前缀式匹配）。
          #    tag 会变成**文件名**（Mosslight-2.0-<tag>-win64.zip）和 Release 的
          #    tag_name，只匹配前缀的话 `2.0.0/../..` 这种也能过 —— 版本号是人敲进来的，
          #    一旦带了 `/` 或 `\`，$env:GITHUB_ENV / GITHUB_OUTPUT 是多行 key=value 格式，
          #    写进去的就不再是"一个值"，后面的 zip 名和 tag 名也一起被带歪。
          #    所以只允许 [0-9A-Za-z.-]：够 semver 用，也不可能拼出路径。
          #    ⚠️ 刻意**不允许 `+`**（semver 的 build metadata）：它在 URL 里要转义，
          #       在文件名里又容易看错，而这个工程的版本号根本用不到它。
          if ($num -notmatch '^[0-9A-Za-z][0-9A-Za-z.\-]*$') {
            throw "版本号 '$tag' 里有不合法字符。只允许字母、数字、`.`、`-`（如 v2.0.0 / v2.0.0-beta.1）。"
          }
          # 再要求它长得像个版本号（至少 x.y），免得把 `release` 这种词当版本号发出去
          if ($num -notmatch '^\d+\.\d+') {
            throw "版本号 '$tag' 不像版本号。请用 v2.0.0 / v2.0.0-beta 这种写法。"
          }

          # 预发布标记：手动走输入框，tag 走名字里有没有 beta/alpha/rc。
          # ⚠️ boolean 型 input 插值进来是字符串 'true'/'false'，但为了不依赖这个细节，
          #    统一按"去空格 + 忽略大小写 + 认 1/yes"来判 —— 手滑写成 True 也算数。
          #    `-match` 默认忽略大小写，所以 tag 上的 -BETA / -RC 一样认。
          $pre = if ($isManual) {
            '${{ inputs.prerelease }}'.Trim().ToLowerInvariant() -in @('true', '1', 'yes')
          } else {
            $tag -match '(beta|alpha|rc)'
          }

          # ⚠️ **`FileVersion` 必须是纯数字**（major[.minor[.build[.revision]]]）。
          #    直接把 `2.0.0-beta` 喂给 `-p:FileVersion=` 会得到
          #        warning CS7035: 指定版本字符串 '2.0.0-beta' 不符合建议格式
          #    而这个仓库到处带 `-warnaserror`（刻意保持 0 警告）——
          #    于是**任何预发布 tag 都发不出去**，而且报的是"警告"，
          #    看日志的人第一眼根本不会往版本号上想。
          #    所以这里单独取"卡掉预发布后缀的纯数字前四段"给 FileVersion，
          #    `Version` 那边保持完整字符串（NuGet 包版本 / InformationalVersion 要它）。
          $filever = (($num -split '-')[0] -split '\.')[0..3] -join '.'
          if ($filever -notmatch '^\d+(\.\d+){0,3}$') {
            throw "推导出来的 FileVersion '$filever' 不是纯数字，会触发 CS7035。"
          }

          "tag=$tag"               >> $env:GITHUB_OUTPUT
          "num=$num"               >> $env:GITHUB_OUTPUT
          "filever=$filever"       >> $env:GITHUB_OUTPUT
          "prerelease=$($pre.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "版本号 = $num（tag $tag），FileVersion = $filever，预发布 = $pre"


      # ----------------------------------------------------------------------
      #  构建
      # ----------------------------------------------------------------------
      - name: 还原
        run: dotnet restore "Mosslight-Launcher 2.0.slnx" -m:1

      # `-m:1` 是跟本地保持一致的保守写法：README 里记着开发机的并行还原会崩
      # （`_GetAllRestoreProjectPathItems` 直接"生成失败"、还不给错误信息）。
      # CI 上未必复现，但单线程构建多花不了几秒，不值得为它冒险。
      #
      # `-warnaserror` 让警告也拦门禁 —— 这个工程目前是 0 警告，能保持住。
      - name: 构建
        run: dotnet build "Mosslight-Launcher 2.0.slnx" -c Release --no-restore -m:1 -warnaserror

      # ⚠️ 这一步**不带** `-p:Version=`：它只负责编出来跑自检 / 冒烟，
      #    版本号还是 `Directory.Build.props` 里那个（2.0.0-alpha）。
      #    真正打发布的那个 `dotnet publish` 才带上 tag 版本（见下面"发布"那一步）。
      #    界面读的是程序集属性，所以**发布出来的 exe 上显示的自然是 tag 版本** ——
      #    不用再改源码（2026-10 之前那一步"覆盖 AppInfo.AppVersion"已经删掉了）。

      # ----------------------------------------------------------------------
      #  自检（门禁）
      # ----------------------------------------------------------------------
      #  金标准（tests/*.json）和 fixture（tests/fixtures）都是**提交进仓库**的，
      #  所以 CI 这里不需要 Python。
      #
      #  ⚠️ 别在这里加 `python tools/gen_launch_golden.py`：那个脚本靠
      #     `D:\开发工程\DHML-src`（1.0.0 的源码）当权威，CI 上没有那个目录。
      #     它是**本地**改完引擎之后重新生成金标准用的，不是 CI 步骤。
      - name: 自检（离线金标准比对）
        shell: pwsh
        run: |
          $exe = 'Mosslight.Core.SelfCheck\bin\Release\net10.0-windows\Mosslight.Core.SelfCheck.exe'
          if (-not (Test-Path $exe)) { throw "自检没编出来：$exe" }
          & $exe 'tests\theme_golden.json'
          if ($LASTEXITCODE -ne 0) { throw "自检没过（退出码 $LASTEXITCODE）—— 别发这个版本" }

      # ----------------------------------------------------------------------
      #  界面冒烟：真的把窗口渲染一遍
      # ----------------------------------------------------------------------
      #  ⚠️ **每一页都要截**，不能只截首页 —— 这个门禁是真抓过东西的：
      #     · 账户页外层 Grid 少声明了一行，页脚 `Grid.Row="4"` 越界，
      #       WPF **不报错**、把它塞回最后一行，结果文字叠在标题上；
      #     · 设置页的 `Slider.ValueChanged` 在 XAML **解析期**就触发，
      #       那时后面的 x:Name 控件还没建出来 → 构造期 NullReferenceException。
      #     两个都是"编译 0 警告、跑起来才炸"，而且都不在首页上。
      #
      #  截图模式是**离屏渲染**（RenderTargetBitmap，不 Show 窗口），
      #  所以不需要显示器。哪天 runner 真的没有桌面会话了，
      #  要放宽的就是这一步 —— 加 `continue-on-error: true` 即可，
      #  别的步骤都跟图形环境无关。
      - name: 界面冒烟（每页离屏渲染一张截图）
        shell: pwsh
        run: |
          $exe = 'Mosslight.App\bin\Release\net10.0-windows\win-x64\Mosslight.exe'
          if (-not (Test-Path $exe)) { throw "界面没编出来：$exe" }

          $dir = Join-Path $env:RUNNER_TEMP 'smoke'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          # 清单在 jobs.<id>.env.SMOKE_PAGES 里（一份，不是抄两遍）
          $pages = $env:SMOKE_PAGES -split '\s+' | Where-Object { $_ }

          $failed = @()
          foreach ($page in $pages) {
            # ⚠️ 文件名里的 `:` 换成 `-`：Windows 上文件名不能带冒号，
            #    `versionsettings:advanced.png` 会直接建不出来。
            $shot = Join-Path $dir "$($page -replace ':', '-').png"
            $p = Start-Process -FilePath $exe `
                               -ArgumentList '--page',$page,'--screenshot',$shot,'--settle','5000' `
                               -PassThru -Wait
            if ($p.ExitCode -ne 0) { $failed += "$page（退出码 $($p.ExitCode)）"; continue }
            if (-not (Test-Path $shot)) { $failed += "$page（没截出图）"; continue }
            # 一张 1280x820 的正常截图有几十 KB；几百字节说明是白板
            $len = (Get-Item $shot).Length
            if ($len -lt 5000) { $failed += "$page（只有 $len 字节，像白板）"; continue }
            Write-Host "  $page OK：$len 字节"
          }

          # 浮层提示（toast）单独截一张：它只在"点了一下收藏"之后才出现，
          # 逐页截图那条路截不到（页面目录里没有、也不该有它）。
          # 走的是跟真点击同一条 `App.MainWindow.ShowToast`，所以样式 key 缺了、
          # 图标资源没生成、浮层挡住布局，这里都会以非零退出码或无图暴露出来。
          $toastShot = Join-Path $dir 'home-toast.png'
          $toast = Start-Process -FilePath $exe `
                                 -ArgumentList '--page','home','--toast','已加入收藏夹',`
                                               '--screenshot',$toastShot,'--settle','900' `
                                 -PassThru -Wait
          if ($toast.ExitCode -ne 0) {
            $failed += "home+toast（退出码 $($toast.ExitCode)）"
          } elseif (-not (Test-Path $toastShot)) {
            $failed += "home+toast（没截出图）"
          } elseif ((Get-Item $toastShot).Length -lt 5000) {
            $failed += "home+toast（截图太小，像白板）"
          } else {
            Write-Host "  home+toast OK：$((Get-Item $toastShot).Length) 字节"
          }

          if ($failed.Count -gt 0) { throw "这些页面没渲染出来：$($failed -join '、')" }
          "SHOTDIR=$dir" >> $env:GITHUB_ENV

      # 发布出问题时能直接看图，不用本地复现
      - name: 留档截图
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: ${{ env.SHOTDIR }}
          retention-days: 7

      # ----------------------------------------------------------------------
      #  打包：**两个包**（框架依赖的小包 + 自带运行时的大包）
      # ----------------------------------------------------------------------
      #  两个包的差别**只有 `--self-contained` 这一个参数**，其余全一样
      #  （单文件 / 原生库自解压 / 版本号 / pdb 清理 / 那一整套硬检查）。
      #  所以下面写成"一张表 + 循环 + 一个验证函数"，而**不是**把同一段逻辑抄两遍 ——
      #  抄两遍的话，两个包迟早会验的不是同一件事。这个工程在 SMOKE_PAGES 上
      #  已经吃过一次"两份清单必然有一份先过期"的亏（见 jobs.release.env 那段注释）。
      #
      #  为什么两个都发，见文件头。这里只记参数上的三个坑（都真踩过）：
      #
      #  1. ⚠️ **`EnableCompressionInSingleFile` 只能给自带运行时那个包。**
      #     给小包加上直接编译失败：
      #         error NETSDK1176: 仅在发布独立应用程序时才支持在单个文件捆绑包中进行压缩。
      #     所以它是**按包给**的（看下面那张表），不是两个包共用。
      #     小包不需要它：框架依赖的 bundle 里只有本工程自己的几个程序集，
      #     压不压都是 2 MB 上下（实测压前压后一样）。
      #
      #  2. ⚠️ **`IncludeNativeLibrariesForSelfExtract=true` 不能省**（至少对大包）。
      #     WPF 有原生库（wpfgfx / PresentationNative）。不加这个的话
      #     它们会作为**散装 dll 落在 exe 旁边** —— 单文件就白做了。
      #
      #  3. ⚠️ **小包也要 `PublishSingleFile=true`**。少写这一条，小包就会变成
      #     "exe + 一堆 dll"的散装形态，而"解压出来就一个文件"这句说明
      #     对其中一个包就是假的 —— 而且不会有任何东西报错。
      #
      #  PublishSingleFile 的代价：启动时要先把自己解到临时目录，所以比散装慢
      #  一点点，换来"解压出来就一个 exe"的观感（两个包同一条路）。
      #
      #  ⚠️ 语言数据的位置：**编在 Mosslight.Core 的程序集里**
      #     （`<EmbeddedResource>`，见 Mosslight.Core.csproj），
      #     所以**两个包**的 exe 都自带 5 种语言，不需要任何伴随目录。
      #     想改翻译的用户，可以在 exe 旁边放 `Assets\lang\xx.json` 覆盖
      #     （Localizer 是"磁盘优先、内嵌回落"两层）—— 那是**可选**的，
      #     发布产物里没有这个目录，下面的硬检查会盯着这一点。
      - name: 发布（两个包：框架依赖 + 自带运行时）
        shell: pwsh
        run: |
          # 一张表定死两个包。`Kind` 只用来打日志，`Dir` 是两个各自独立的输出目录
          # （**不能用同一个目录**：第二次 publish 会往第一次的产物上叠，
          #  而 `-o` 不会帮忙清空，最后打出来的 zip 到底是哪个包说不清）。
          # 顺序就是"谁是主推"的顺序 —— 小包在前，日志里一眼能看出主次。
          $variants = @(
            [pscustomobject]@{ Kind = '小包'; Dir = 'publish-fx'
                               SelfContained = 'false'; Compress = $false
                               Note = '框架依赖，要机器上有 .NET 10 桌面运行时' },
            [pscustomobject]@{ Kind = '大包'; Dir = 'publish-sc'
                               SelfContained = 'true';  Compress = $true
                               Note = '自带运行时，零依赖' }
          )

          # 两个包都要过的那套硬检查。**抽成函数是故意的** ——
          # 两个包必须验的是同一件事，各抄一份迟早会漂成两套判据。
          function Assert-PublishDir([string]$out, [string]$kind) {
            # 语言文件现在**编进了 Mosslight.Core 的程序集**（EmbeddedResource），
            # 所以发布目录里不该再有 `Assets\` —— 以前这里断言的是
            # "`$out\Assets\lang\zh_CN.json` 必须在"，那正是要干掉的东西。
            # 反过来了：**`Assets` 出现就是回归**（说明有人把语言文件又改回
            # CopyToOutputDirectory 了），而那种回归的表现是"发布包悄悄多出一个目录"，
            # 没有这一条根本不会有人发现。
            if (Test-Path (Join-Path $out 'Assets')) {
              throw "[$kind] 发布产物里又出现了 Assets\ 目录 —— 语言文件应该编进程序集（见 Mosslight.Core.csproj）"
            }

            # 顺手确认版本号真的写进 exe 了（这里读的是**产物里的**元数据，不是源码）：
            # 发布路径上"版本号没传进去"这种事不会报错，只会在用户看到的属性页里露馅。
            $exe = Join-Path $out 'Mosslight.exe'
            if (-not (Test-Path $exe)) { throw "[$kind] 发布产物里没有 Mosslight.exe" }
            $vi = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $exe).Path)
            Write-Host "[$kind] exe 元数据：FileVersion=$($vi.FileVersion)  ProductVersion=$($vi.ProductVersion)"
            if ($vi.FileVersion -ne '${{ steps.ver.outputs.filever }}') {
              throw "[$kind] exe 的 FileVersion 是 '$($vi.FileVersion)'，期望 '${{ steps.ver.outputs.filever }}'"
            }
            if ($vi.FileVersion -notmatch '^\d+(\.\d+){0,3}$') {
              throw "[$kind] exe 的 FileVersion '$($vi.FileVersion)' 不是纯数字——发布过程里踩到 CS7035 了"
            }

            # ⚠️ **ProductVersion 就是界面读的那个值**（`AssemblyInformationalVersion`，
            #    见 AppInfo.AppVersion）。它对不上时不会报任何错 —— 但用户看到的
            #    "exe 属性"和"启动器左下角"会**同时**是错的版本号。
            #    2026-10 之前这一步只打印不判，等于看着玩；现在它是硬断言。
            if ($vi.ProductVersion -ne '${{ steps.ver.outputs.num }}') {
              throw "[$kind] exe 的 ProductVersion 是 '$($vi.ProductVersion)'，期望 '${{ steps.ver.outputs.num }}'（-p:Version 没传进发布产物？）"
            }

            # ⚠️ 这一段**必须显式 Out-Host / Out-String**：`Get-ChildItem | Select-Object`
            #    本身不产生任何输出（PowerShell 只会把它塞进管道，没人接就丢掉），
            #    以前这里少了这一下，CI 日志里那段"发布产物清单"其实是**空的**。
            $root = (Resolve-Path $out).Path
            Get-ChildItem $out -Recurse -File |
              Select-Object @{n='文件';e={$_.FullName.Replace($root + '\','')}},
                            @{n='KB';e={[math]::Round($_.Length/1KB)}} |
              Format-Table -AutoSize | Out-String -Width 200 | Write-Host

            # 顶层**恰好一个文件**：只有 exe，一个散装 dll 都没有。
            # 这条同时盖住了"原生库没打进去"（wpfgfx / PresentationNative 会散在
            # exe 旁边）和"语言文件又在旁边生成目录"两类回归。两个包都适用 ——
            # 小包也是 PublishSingleFile，理由见上面第 3 条注释。
            $topFiles = @(Get-ChildItem $out -File)
            $topDlls  = @($topFiles | Where-Object { $_.Extension -eq '.dll' })
            if ($topDlls.Count -gt 0) {
              throw ("[$kind] exe 旁边还散着 $($topDlls.Count) 个 dll：" +
                     (($topDlls | ForEach-Object Name) -join '、') +
                     " —— 单文件没做成（多半是 IncludeNativeLibrariesForSelfExtract 丢了）")
            }
            if ($topFiles.Count -ne 1) {
              throw ("[$kind] 发布产物顶层应该**恰好 1 个文件**（Mosslight.exe），实际 $($topFiles.Count) 个：" +
                     (($topFiles | ForEach-Object Name) -join '、'))
            }
            if ($topFiles[0].Name -ne 'Mosslight.exe') {
              throw "[$kind] 发布产物顶层那个文件是 '$($topFiles[0].Name)'，不是 Mosslight.exe"
            }

            # 把 exe 字节数**当返回值交出去**（Write-Host 走的是 host，不进管道，
            # 所以这里 return 的东西就是函数唯一的输出）
            return (Get-Item $exe).Length
          }

          $exeSizes = [ordered]@{}
          foreach ($v in $variants) {
            Write-Host ''
            Write-Host ('=' * 72)
            Write-Host "发布【$($v.Kind)】→ $($v.Dir)　--self-contained $($v.SelfContained)　（$($v.Note)）"
            Write-Host ('=' * 72)

            # ⚠️ 参数拼进一个数组再 splat（`@pubArgs`），不要直接写一长串反引号续行：
            #    压缩那一项是**条件加**的，续行写法没法条件插入。
            # ⚠️ 变量名**不能叫 `$args`**：那是 PowerShell 的自动变量
            #    （函数/脚本块的未绑定参数），赋值能过、但在别的上下文里会读到怪东西。
            $pubArgs = @(
              'Mosslight.App\Mosslight.App.csproj',
              '-c', 'Release', '-r', 'win-x64',
              '--self-contained', $v.SelfContained,
              '-p:PublishSingleFile=true',
              '-p:IncludeNativeLibrariesForSelfExtract=true',
              '-p:Version=${{ steps.ver.outputs.num }}',
              '-p:FileVersion=${{ steps.ver.outputs.filever }}',
              '-o', $v.Dir, '-m:1'
            )
            # ⚠️ 压缩**只给自带运行时那个包**：给小包加上会 NETSDK1176 直接失败
            #    （见上面第 1 条注释）。这是两个包在参数上唯一的差别。
            if ($v.Compress) { $pubArgs += '-p:EnableCompressionInSingleFile=true' }

            & dotnet publish @pubArgs
            if ($LASTEXITCODE -ne 0) { throw "[$($v.Kind)] 发布失败（退出码 $LASTEXITCODE）" }

            # ⚠️ `-warnaserror` **不能**加在这一步上：publish 会重新跑一遍编译，
            #    而版本号相关的 CS7035 是个 warning —— 上面已经用纯数字的 filever
            #    把它从源头上避开了，这里再叠一层 warnaserror 只会让发布路径脆弱
            #    （构建那步已经用 -warnaserror 把关过了，同一个工程不会只在这一步冒警告）。

            # .pdb 不进发布包：用户用不上，而且带着它等于把源码路径也发出去了
            Get-ChildItem $v.Dir -Filter *.pdb -Recurse | Remove-Item -Force

            $bytes = Assert-PublishDir $v.Dir $v.Kind
            $exeSizes[$v.Dir] = $bytes
            Write-Host ("【$($v.Kind)】检查通过：$($v.Dir) 顶层恰好 1 个文件（Mosslight.exe），" +
                        "0 个散装 dll，无 Assets\ 目录，exe $([math]::Round($bytes/1MB, 2)) MB")
          }

          # 小包必须**明显小于**大包 —— 这是"两个包"这件事本身的验收标准。
          # 少了这条，哪天有人把两个包的 `--self-contained` 写成一样（复制粘贴走样），
          # 流程照样全绿，只是 Release 上挂了两个一模一样的 55MB 包。
          $fx = $exeSizes['publish-fx']
          $sc = $exeSizes['publish-sc']
          if ($fx -ge $sc) {
            throw ("小包（$([math]::Round($fx/1MB,2)) MB）居然不小于大包（$([math]::Round($sc/1MB,2)) MB）" +
                   " —— 两个包的自带运行时参数多半写重了")
          }
          Write-Host ''
          Write-Host "两个包都发布成功：小包 $([math]::Round($fx/1MB,2)) MB / 大包 $([math]::Round($sc/1MB,2)) MB"

      # ----------------------------------------------------------------------
      #  单文件产物冒烟（**跟上面那次不是一回事**，而且**两个包都要跑**）
      # ----------------------------------------------------------------------
      #  上面那一步冒烟跑的是 `bin\...\Mosslight.exe`，那是**框架依赖**的散装产物；
      #  而真正发给用户的是 PublishSingleFile + IncludeNativeLibrariesForSelfExtract
      #  的**自解压单文件**。这两条路的差别只有真跑一次才现形：
      #    · 原生库（wpfgfx / PresentationNative）要从自己的 bundle 里解出来才能渲染；
      #    · 语言数据现在是**编在程序集里**的，脱离 Assets\ 之后还读不读得到；
      #    · 在别的目录（比如带空格的路径）里跑得起来吗。
      #  这三件事任何一件坏了，**用户那边就是双击没反应 / 界面全是英文**，
      #  而前面的门禁全绿。
      #
      #  ⚠️ **两个包都要跑，而且用的是同一段代码**（下面那个函数跑两遍）。
      #     小包在这条路上多一个独有的风险：它是框架依赖的，**运行时不在包里**，
      #     全靠机器上装的那份 —— 而 `--self-contained false` + `PublishSingleFile`
      #     这个组合本身会不会解压出问题，只有真跑一次才知道。
      #     只在 runner 上验大包的话，小包是"发出去才第一次被运行"。
      #
      #  ⚠️ 小包在 **GitHub runner 上跑得起来**：`setup-dotnet` 装的是 SDK，
      #     SDK 自带 .NET 10 桌面运行时，所以框架依赖的 exe 在这里有运行时可用。
      #     也就是说这一步能证明"包本身是好的"，**证明不了**"没装运行时的机器上
      #     会弹什么" —— 那个只能拿一台干净的 Windows 试，见 README 里的说明。
      #
      #  ⚠️ 这一步**只拷 exe 一个文件**（不再是 `Copy-Item $pub\* -Recurse`）。
      #     用户拿到的就是这么一个孤零零的 exe，所以这里要复现的正是那个形态 ——
      #     顺手把 Assets\ 一起拷过去的话，"脱离 Assets 到底行不行"就永远验不到了。
      - name: 单文件产物冒烟（两个包各拷 exe 到干净目录真跑一次）
        shell: pwsh
        run: |
          # ⚠️ 自己起进程而不用 Start-Process：要**显式指定 UTF-8** 读子进程输出
          #    （界面里打的是中文），Start-Process 的 -RedirectStandardOutput
          #    按控制台默认编码读，中文会变乱码。
          #
          # ⚠️⚠️ 用 `$psi.Arguments`（一个字符串），**不要**用 `$psi.ArgumentList.Add(...)`：
          #    `ArgumentList` 是 .NET Core 2.1 才有的属性，**Windows PowerShell 5.1
          #    跑在 .NET Framework 上、根本没有它** —— 写成 ArgumentList 的话
          #    本地 `tools\local_run_workflow.py` 一跑就是
          #    "You cannot call a method on a null-valued expression"，
          #    而 GitHub 的 `shell: pwsh`（PS 7）反而没事。同一个坑工程里踩过。
          #    路径可能带空格（"smoke publish fx"），所以每个参数自己套引号。
          function Quote([string]$value) { '"' + $value + '"' }

          function Invoke-PackSmoke([string]$pub, [string]$kind, [string]$slug) {
            Write-Host ''
            Write-Host ('=' * 72)
            Write-Host "冒烟【$kind】← $pub"
            Write-Host ('=' * 72)

            if (-not (Test-Path (Join-Path $pub 'Mosslight.exe'))) {
              throw "[$kind] 发布产物里没有 Mosslight.exe"
            }

            # 拷到临时目录再跑：
            #   · 带空格的路径 —— 真实用户解压出来的目录经常就有空格；
            #   · portable.txt —— 配置落在这一份拷贝里，不碰 runner 的 %APPDATA%；
            #   · 不污染 publish-*\ —— 那两个目录马上要被打成 zip，一个多余文件都不该进去。
            #
            # ⚠️ 两个包用**各自独立**的临时目录，别共用一个：共用的话第二个包跑之前
            #    得先清空，而"清空"一旦没做干净（上一个包的 Logs\ 留着），
            #    验的就不是"干净目录"了 —— 这一步的全部意义就在于目录是干净的。
            $sb = Join-Path $env:RUNNER_TEMP "smoke publish $slug"
            if (Test-Path $sb) { Remove-Item -Recurse -Force $sb }
            New-Item -ItemType Directory -Force -Path $sb | Out-Null
            # ⚠️ **只拷 exe**，不拷 Assets\、不拷任何目录
            Copy-Item -Force (Join-Path $pub 'Mosslight.exe') $sb
            $copied = @(Get-ChildItem $sb)
            if ($copied.Count -ne 1 -or $copied[0].Name -ne 'Mosslight.exe') {
              throw ("[$kind] 干净目录里应该只有 Mosslight.exe 一个文件，实际：" +
                     (($copied | ForEach-Object Name) -join '、'))
            }

            # portable.txt 是**必须**的：不建它的话配置会读 `%APPDATA%\Mosslight\config.json`，
            # 而 runner 上前面的界面冒烟步骤可能已经写过它了 —— 那样这里验的语言
            # 就不是"默认形态"，断言也就不是确定的了。建了它，配置就落在这一份拷贝里，
            # 从零开始（跟用户第一次双击 exe 的形态一致）。
            New-Item -ItemType File -Force -Path (Join-Path $sb 'portable.txt') | Out-Null

            $exe = Join-Path $sb 'Mosslight.exe'
            $smokeDir = Join-Path $env:RUNNER_TEMP 'smoke'
            New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null
            $png = Join-Path $smokeDir "published-$slug.png"
            if (Test-Path $png) { Remove-Item -Force $png }

            $psi = [System.Diagnostics.ProcessStartInfo]::new($exe)
            $psi.Arguments = (@(
              (Quote '--page'), (Quote 'home'),
              (Quote '--screenshot'), (Quote $png),
              (Quote '--settle'), (Quote '5000')
            ) -join ' ')
            $psi.UseShellExecute = $false
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $psi.StandardOutputEncoding = [System.Text.Encoding]::UTF8
            $psi.StandardErrorEncoding = [System.Text.Encoding]::UTF8
            $proc = [System.Diagnostics.Process]::Start($psi)
            $stdout = $proc.StandardOutput.ReadToEnd()
            $stderr = $proc.StandardError.ReadToEnd()
            $proc.WaitForExit()
            if ($stdout.Trim()) { Write-Host "---- exe 输出 ----"; Write-Host $stdout.Trim() }
            if ($stderr.Trim()) { Write-Host "---- exe 错误输出 ----"; Write-Host $stderr.Trim() }

            if ($proc.ExitCode -ne 0) {
              $crash = Join-Path $sb 'Logs\crash.log'
              if (Test-Path $crash) { Get-Content $crash -Tail 40 | Out-String | Write-Host }
              throw "[$kind] 单文件产物起不来（退出码 $($proc.ExitCode)）—— 用户双击就是这个结果"
            }
            if (-not (Test-Path $png)) { throw "[$kind] 单文件产物没截出图：$png" }
            $len = (Get-Item $png).Length
            if ($len -lt 5000) { throw "[$kind] 单文件产物截出来只有 $len 字节，像白板" }

            # ----------------------------------------------------------------
            # 语言数据真的从**程序集里**读到了 —— 这是"单文件也能翻译"的硬证据
            # ----------------------------------------------------------------
            # 同一个 exe 再跑一次 `--lang-check`：它把每种语言的**来源**（磁盘 / 内嵌）、
            # 条数、以及"多少条真的跟中文源文不同"打出来，不建窗口、几秒钟就退。
            #
            # ⚠️ 为什么不在上面那次截图里顺手验：语言是**配置**决定的，配置里存过
            #    `language: en_US` 就永远是英文 —— 拿它当判据会变成"看 runner 的脸色"。
            #    `--lang-check` 逐个语言显式切一遍，每种语言各验一次，判据是确定的。
            $p2 = Start-Process -FilePath $exe -ArgumentList '--lang-check' -PassThru -Wait `
                                -RedirectStandardOutput (Join-Path $sb 'langcheck.txt') `
                                -RedirectStandardError (Join-Path $sb 'langcheck.err')
            # ⚠️ 用 ReadAllText + 显式 UTF-8 读：exe 里 Console.OutputEncoding 是 UTF-8，
            #    而 Start-Process 重定向写出来的文件按控制台默认编码解码会变乱码 ——
            #    乱码不会让下面的 match 报错，只会**静默失配**，最难查的那种假绿。
            $langText = [System.IO.File]::ReadAllText((Join-Path $sb 'langcheck.txt'),
                                                      [System.Text.Encoding]::UTF8)
            Get-Content (Join-Path $sb 'langcheck.txt') -Encoding UTF8 | Out-String | Write-Host
            if ($p2.ExitCode -ne 0) {
              throw "[$kind] 单文件产物的语言数据不对（--lang-check 退出码 $($p2.ExitCode)）——" +
                    "翻译必须来自程序集，详情见上面的 [lang] 输出"
            }
            if ($langText -notmatch '\[lang\] 结论：全部通过') {
              throw "[$kind] --lang-check 没报「全部通过」，输出见上"
            }

            Write-Host "[$kind] 单文件产物 OK：只有 exe 一个文件、截图 $len 字节、语言数据全部来自内嵌"
            Remove-Item -Recurse -Force $sb
          }

          # 两个包跑同一段冒烟。Slug 只用来区分临时目录和截图文件名（**用 ASCII**：
          # 这两个值会变成路径的一部分，中文路径在 CI 上没必要冒险）。
          Invoke-PackSmoke 'publish-fx' '小包' 'fx'
          Invoke-PackSmoke 'publish-sc' '大包' 'sc'
          Write-Host ''
          Write-Host "两个包的单文件冒烟都通过（各自解压到干净目录、截图非白板、语言数据来自内嵌）"

      - name: 打 zip
        shell: pwsh
        run: |
          $tag = '${{ steps.ver.outputs.tag }}'

          # 两个包各打一个 zip。**名字和大小门槛都在这张表里**，别在下面再写死。
          #
          # ⚠️ 大小门槛为什么**两个包各不相同**（原来只有一条"至少 10MB"）：
          #    那条 10MB 是给自带运行时那个包写的 —— 里面躺着一个 60MB 的 exe，
          #    所以"10MB 以下肯定是坏的"完全成立。
          #    但小包的 exe 只有 2MB 上下，zip 实测 **约 1.3MB** —— 拿 10MB 去卡它，
          #    **每次发版都会红**，而红的原因跟"包坏了"一点关系都没有。
          #    所以两条门槛各自按"实测值往下留足余量、但仍能抓住明显坏包"来取：
          #      · 小包：实测 zip 约 1.3MB（exe 2.03MB）→ 下限 **1MB**。
          #        真出坏包（publish 参数丢了 / 打进一个空壳）时 zip 会掉到几百 KB，
          #        1MB 拦得住；而正常波动（换 SDK、改文案）不会掉到 1MB 以下。
          #      · 大包：实测 zip 约 55MB（exe 60.2MB）→ 下限 **10MB**，**保持原值**。
          #
          # ⚠️ 小包额外加一条**上限**（大包不设：它本来没有天花板）。
          #    小包是"主推的那个小包"，而它唯一会变得不可信的方式就是
          #    **悄悄变大** —— 哪天有人把它的 `--self-contained` 写成 true
          #    （或者把两个包的输出目录抄串了），它会变成 55MB，
          #    而名字、正文、Release 页上还都写着"小包 / 约 1.3MB"。
          #    下限拦不住这种事（55MB 当然大于 1MB），上限才拦得住。
          $zips = @(
            [pscustomobject]@{
              Kind = '小包'; Dir = 'publish-fx'
              Name = "Mosslight-2.0-$tag-win64.zip"
              MinMB = 1; MaxMB = 10; EnvKey = 'ZIP' },
            [pscustomobject]@{
              Kind = '大包'; Dir = 'publish-sc'
              Name = "Mosslight-2.0-$tag-win64-selfcontained.zip"
              MinMB = 10; MaxMB = $null; EnvKey = 'ZIP_SC' }
          )

          # 两个包都要过的那套 zip 硬检查。跟发布那步一样抽成函数：
          # **两个包必须验的是同一件事**，各抄一份迟早会漂。
          function Assert-ZipContents([string]$name, [string]$kind) {
            # 留一份内容清单在日志里：以后有人报"解压出来不能用"，
            # 第一件要确认的事就是 zip 里到底是什么结构（有没有多一层目录）。
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $name).Path)
            try {
              Write-Host "---- [$kind] $name zip 内容（$($zip.Entries.Count) 项）----"
              $zip.Entries | ForEach-Object { Write-Host ("  {0,-46} {1,10}" -f $_.FullName, $_.Length) }

              # ---- 硬检查：zip 顶层**恰好一个文件 Mosslight.exe** ----
              #
              # 语言文件改成内嵌资源之后，包里就该只剩一个 exe 了。这条断言把
              # "又变回 exe + Assets\ 的组合"当场拦住 —— 那正是要拿掉的东西。
              # **两个包都是这个形态**（小包也是 PublishSingleFile），所以这条
              # 对两个包一视同仁，没有"小包可以散装"这种例外。
              #
              # ⚠️ 判据用"恰好 1 个条目、且它就是 Mosslight.exe"，**不写"没有 Assets\"**
              #    那种黑名单：黑名单只挡得住想得到的那一种（Assets\），而
              #    "多出来一个 Launcher.dll / README.txt"照样能溜过去。
              #    zip 里的分隔符是 **`/`**（ZIP 规范），顶层就是不含 `/` 的条目。
              $entries = @($zip.Entries)
              $top = @($entries | Where-Object { $_.FullName -notmatch '/' })
              if ($top.Count -ne 1) {
                throw ("[$kind] zip 顶层应该**恰好 1 个文件**（Mosslight.exe），实际 $($top.Count) 个：" +
                       (($top | ForEach-Object FullName) -join '、'))
              }
              if ($top[0].FullName -ne 'Mosslight.exe') {
                throw "[$kind] zip 顶层那个文件是 '$($top[0].FullName)'，不是 Mosslight.exe"
              }
              if ($entries.Count -ne 1) {
                throw ("[$kind] zip 里除 Mosslight.exe 之外还有 $($entries.Count - 1) 项：" +
                       ((($entries | Where-Object { $_.FullName -ne 'Mosslight.exe' }) |
                         ForEach-Object FullName) -join '、') +
                       " —— 语言数据应该编在程序集里，包里的目录都是回归")
              }
              # 把"没有 Assets\ 目录"单独说一遍：这是最直接的那条验收标准，
              # 混在上面那条"恰好 1 个条目"里，红了不好一眼看出是哪件事
              if ($entries | Where-Object { $_.FullName -like 'Assets/*' -or $_.FullName -like 'Assets\*' }) {
                throw "[$kind] zip 里还有 Assets\ 目录 —— 单文件没做成"
              }
              # pdb 不该在包里（源码路径会跟着发出去）—— 上面"恰好 1 项"已经盖住了，
              # 但留着它，红了的时候能直接看出是 pdb 而不是别的
              $pdbs = @($entries | Where-Object { $_.FullName -like '*.pdb' })
              if ($pdbs.Count -gt 0) {
                throw ("[$kind] zip 里还有 $($pdbs.Count) 个 pdb：" + (($pdbs | ForEach-Object FullName) -join '、'))
              }
              Write-Host "[$kind] zip 硬检查通过：顶层恰好 1 项 Mosslight.exe，无 Assets\ 目录，无散装 dll，无 pdb"
            } finally { $zip.Dispose() }
          }

          foreach ($z in $zips) {
            Write-Host ''
            Write-Host ('=' * 72)
            Write-Host "打 zip【$($z.Kind)】$($z.Name)　← $($z.Dir)"
            Write-Host ('=' * 72)

            if (Test-Path $z.Name) { Remove-Item -Force $z.Name }
            # -Path '<目录>\*'（带星号）才让 zip 里是 **exe 直接在根**；
            # 写成 -Path '<目录>' 的话解压出来会多一层 publish-fx\ 目录。
            # ⚠️ 大包那个 exe 有 60MB 上下，Compress-Archive 是**压缩**不是打包，
            #    这一步在 CI 上要花一两分钟，别以为它卡死了。
            # ⚠️ 这里**不能**检查 `$LASTEXITCODE`：`Compress-Archive` 是 cmdlet 不是
            #    外部程序，它根本不改 `$LASTEXITCODE` —— 那个变量还留着上一条外部
            #    命令留下的值（本地真跑时就是这么炸的："打包失败（退出码 ）"，
            #    括号里是空的）。判据只能是"文件在不在、大不大"。
            Compress-Archive -Path (Join-Path $z.Dir '*') -DestinationPath $z.Name -Force
            if (-not (Test-Path $z.Name)) { throw "[$($z.Kind)] 打包没产出 $($z.Name)" }

            $bytes = (Get-Item $z.Name).Length
            $mb = [math]::Round($bytes / 1MB, 1)
            if ($bytes -lt $z.MinMB * 1MB) {
              throw ("[$($z.Kind)] 打出来的 zip 只有 $mb MB，低于下限 $($z.MinMB) MB —— " +
                     "这份肯定不对（$($z.Kind)的正常大小见 release.yml 里打 zip 那段的注释）")
            }
            if ($z.MaxMB -and $bytes -gt $z.MaxMB * 1MB) {
              throw ("[$($z.Kind)] 打出来的 zip 有 $mb MB，超过上限 $($z.MaxMB) MB —— " +
                     "小包不该这么大：多半是它的 --self-contained 被写成 true 了，" +
                     "那样两个包就一样大了，Release 上'小包'这个名字会骗人")
            }
            Write-Host "[$($z.Kind)] $($z.Name)（$mb MB）"
            "$($z.EnvKey)=$($z.Name)" >> $env:GITHUB_ENV

            Assert-ZipContents $z.Name $z.Kind
          }

          # 两个包的体量必须真的差开（跟发布那步同一条理由：两个包变成一个包，
          # 这条是唯一会红的判据）。
          $fxMB = [math]::Round((Get-Item $zips[0].Name).Length / 1MB, 1)
          $scMB = [math]::Round((Get-Item $zips[1].Name).Length / 1MB, 1)
          Write-Host ''
          Write-Host "两个 zip 都打好了：小包 $($zips[0].Name) $fxMB MB / 大包 $($zips[1].Name) $scMB MB"

      # 就算 Release 那步出问题，也能从 Actions 页面把包下下来。
      # **两个包各传一份** —— 只传一个的话，另一个包在 Release 建失败时就没有退路，
      # 而"建 Release"恰恰是最容易因为权限/网络出问题的一步。
      #
      # ⚠️ 这里传的是**那个 exe 文件**，不是上面打好的 zip ——
      #    `actions/upload-artifact` **自己会把上传内容打成 zip**。
      #    以前传的是 `$env:ZIP`（已经是一个 zip 了），于是从 Actions 页面下下来是
      #    `Mosslight-2.0-win64.zip` → 里面还躺着一个
      #    `Mosslight-2.0-v1.5.1-win64.zip` → 再里面才是 `Mosslight.exe`（用户报过"套了两层"）。
      #    传 exe 之后，artifact 那一层的 zip 里直接就是 `Mosslight.exe`，
      #    跟 Release 上那个包**结构完全一致**，从哪个入口下都不会多一层。
      #
      # ⚠️ artifact 名里带上 tag：Actions 页面上一排 `Mosslight-2.0-win64.zip`
      #    分不清是哪一版（下载时 GitHub 按 artifact 名 + `.zip` 命名）。
      - name: 留档安装包（小包 · 框架依赖）
        uses: actions/upload-artifact@v4
        with:
          name: Mosslight-2.0-${{ steps.ver.outputs.tag }}-win64
          path: publish-fx/Mosslight.exe
          retention-days: 14

      - name: 留档安装包（大包 · 自带运行时）
        uses: actions/upload-artifact@v4
        with:
          name: Mosslight-2.0-${{ steps.ver.outputs.tag }}-win64-selfcontained
          path: publish-sc/Mosslight.exe
          retention-days: 14

      # ----------------------------------------------------------------------
      #  发行说明
      # ----------------------------------------------------------------------
      #  产物是**仓库根目录那份 `RELEASE_BODY.md`** —— 它同时是两样东西：
      #    · 仓库里提交的**兜底正文**：不写死任何版本号的一段通用下载说明
      #      （见文件里那段注释）。body_path 永远指向它，所以哪怕下面这步整个炸了，
      #      Release 也不会是空正文、更不会因为"读不到 body_path"而建不出来
      #      （softprops/action-gh-release 读不到 body_path 是**直接报错**，
      #       不回退到别的正文 —— 见 softprops/action-gh-release#664）；
      #    · 正常发版时被下面这步**覆盖**成"这一次"的正文：zip 名、
      #      与上个版本的 compare 链接、CHANGELOG 里这一节，全是现场拼的。
      #
      #  为什么不干脆手写一份定稿：手写正文最容易出的事就是"下载说明里写死了
      #  上一次的版本号 / zip 名"，而那个错误**不会报错**，只会在 Release 页上
      #  挂着一个点不动的文件名。
      #
      #  保险丝三层，任何一层坏了都不会变成"没正文"或"发不出去"：
      #    1. 脚本内部每段都套了 RunWithLog：CHANGELOG 解析 / git describe 挂掉
      #       只是少一段，正文照写；
      #    2. 真写失败了 → 抛错，但这一步是 continue-on-error，job 继续往下走
      #       （提交进版本库的那份兜底正文原样未动）；
      #    3. 下一步会用 always() 检查正文到底在不在、像不像，并在日志里说明。
      - name: 组装发行说明
        shell: pwsh
        # ⚠️ 不能让"正文组装失败"把整个发版打断：包已经打好、artifact 已经上传，
        #    这时候最该做的是**先把 Release 建出来**（正文退化成通用说明），
        #    而不是让用户等了一轮 CI 却什么都没有。
        continue-on-error: true
        env:
          # 先生成到临时文件，最后一步才挪进仓库 —— 见下面 Move-Item 那段注释
          TMP_BODY: ${{ runner.temp }}\release_body_generated.md
        run: |
          $tag   = '${{ steps.ver.outputs.tag }}'
          $zip   = $env:ZIP
          $zipSc = $env:ZIP_SC
          $repo  = $env:GITHUB_REPOSITORY

          # 两个包的**真实大小**（现场量，不写死）。
          # 为什么要现场量：正文里"约 xx MB"是用户挑包的唯一依据，
          # 而写死的大小迟早跟实际对不上（换 SDK / 加资源都会变）——
          # 对不上的时候**不会报错**，只会在 Release 页上挂一句骗人的话。
          # 文件不在了就退回一句不写死数字的说法，别让正文里出现空白或 0 MB。
          function Get-SizeText([string]$name) {
            if (-not $name) { return '大小见附件' }
            if (-not (Test-Path $name)) { return '大小见附件' }
            $mb = (Get-Item $name).Length / 1MB
            # 小于 10MB 的保留一位小数（小包 1.3MB 这种，取整会变成"1 MB"，差 30%）
            if ($mb -lt 10) { return ('约 {0:N1} MB' -f $mb) }
            return ('约 {0:N0} MB' -f $mb)
          }

          # ⚠️ 下面用 `function RunWithLog { ... }` **把结果 return 出来**，而不是在
          #    scriptblock 里往外层变量赋值 —— 这不是风格问题，是 PowerShell 的作用域：
          #    `& $scriptblock` 会开一个**子作用域**，里面 `$prev = ...` 只改子作用域那份，
          #    外层的 `$prev` 一点没变。原版就是这么写的，于是：
          #      · compare 链接那一行**永远不出现**（不报错，只是少一行）；
          #      · CHANGELOG 的解析结果永远进不了 `$text`，
          #        发行说明永远是那句"没找到说明"。
          #    两个都是"看着跑了、其实什么都没做"，本地这次用真仓库一测就露馅了。
          #    同理 `$ErrorActionPreference` 默认是 Continue，读不到变量只会往 stderr
          #    写一行 —— `local_run_workflow.py` 那种只看退出码的跑法根本不会报。
          #
          # 某一段挂掉就记一条日志，返回 $null 让调用方自己兜底
          # （正文宁可少一段，也不能整份没有）
          function RunWithLog([string]$what, [scriptblock]$body) {
            try { return (& $body) }
            catch {
              Write-Host "::warning::$what 失败，这一段跳过：$($_.Exception.Message)"
              return $null
            }
          }

          # ⚠️ 量大小这两句**必须排在 RunWithLog 定义之后**：PowerShell 是从上往下
          #    执行脚本的，函数要等 `function` 那一行被执行到才存在 ——
          #    写在前面的话不是"编译错误"，是运行期一句
          #    "The term 'RunWithLog' is not recognized"，而这一步是
          #    continue-on-error，整份正文会悄悄退化成兜底版本、流程照样绿。
          $sizeFx = RunWithLog '量小包大小' { Get-SizeText $zip }
          $sizeSc = RunWithLog '量大包大小' { Get-SizeText $zipSc }
          if (-not $sizeFx) { $sizeFx = '大小见附件' }
          if (-not $sizeSc) { $sizeSc = '大小见附件' }
          Write-Host "小包 $zip = $sizeFx　大包 $zipSc = $sizeSc"

          # 上一个 tag：compare 链接那一半。
          #
          # ⚠️ 两种触发方式要分开处理，不然**总有一种拿不到 compare 链接**：
          #    · 推 tag 触发：tag 已经存在、就指在当前提交上 → 起点用 `"$tag^"`
          #      （不加 `^` 会 describe 到自己，compare 就是空 diff）；
          #    · 手动 dispatch：**tag 是后面那步才建的**，此刻 `"$tag^"` 根本解析不了 →
          #      describe 直接失败、compare 链接**静默消失**（2026-10 的 v1.5.1 就是这样：
          #      正文里没有那一行，而且不报错）。所以退回 `HEAD`：
          #      describe HEAD 给的是"离当前提交最近的 tag"，正是"上一个版本"。
          #
          # ⚠️ 两个 `--match` 都要：版本号规则改成学 PCL2 之后（`2.0.0` 这种，
          #    **不带 v 前缀**），只匹配 `v*` 的话 `git describe` 永远找不到我们自己
          #    的上一个版本，只能退到很久以前的 `v1.0.5` —— compare 链接会指向一堆
          #    八竿子打不着的旧提交，而且不报错。`[0-9]*` 认不带前缀的（`2.0.0`）。
          $prev = RunWithLog 'git describe 找上一个 tag' {
            git rev-parse -q --verify "refs/tags/$tag" 2>$null | Out-Null
            $haveTag = ($LASTEXITCODE -eq 0)
            $ref = if ($haveTag) { "$tag^" } else { 'HEAD' }
            $state = if ($haveTag) { '已存在' } else { '还没建（手动触发）' }
            Write-Host "describe 起点 = $ref（tag $state）"
            $p = git describe --tags --abbrev=0 --match 'v*' --match '[0-9]*' $ref 2>$null
            if ($LASTEXITCODE -ne 0) { return $null }
            return $p
          }
          if (-not $prev) { Write-Host "（没找到 $tag 之前的上一个 tag，compare 链接会省略）" }
          else { Write-Host "上一个 tag = $prev" }

          # ① 更新内容：CHANGELOG.md 有对应小节就用它。
          #    找法跟 1.0.0 一致（先精确匹配版本号，再退回「未发布」/「Unreleased」），
          #    这样平时只要往「未发布」里追加内容就行。
          $text = RunWithLog '读 CHANGELOG.md' {
            if (-not (Test-Path CHANGELOG.md)) {
              Write-Host "（仓库里没有 CHANGELOG.md）"
              return ''
            }
            $sections = [ordered]@{}
            $current = $null
            foreach ($line in (Get-Content CHANGELOG.md -Encoding UTF8)) {
              if ($line -match '^##\s+(.+)$') {
                $current = $matches[1].Trim()
                $sections[$current] = @()
                continue
              }
              if ($current) { $sections[$current] += $line }
            }
            Write-Host "CHANGELOG 小节：$($sections.Keys -join '、')"
            foreach ($key in @($tag, ($tag -replace '^v',''), '未发布', 'Unreleased')) {
              if ($sections.Contains($key)) {
                # 先剥掉 HTML 注释再判断有没有内容：「未发布」那节平时只放一句
                # 说明用的注释，不剥掉的话它会被当成正文（markdown 里看不见，
                # 但会占着位置，让"这版没写说明"走不到下面的提示）
                $candidate = (($sections[$key] -join "`n") -replace '(?s)<!--.*?-->', '').Trim()
                if ($candidate) { Write-Host "用 CHANGELOG 的「$key」小节"; return $candidate }
              }
            }
            return ''
          }
          if (-not $text) { Write-Host "（CHANGELOG 里没有这一版的说明，正文会用通用提示）" }

          # ② 正文
          $body = @()
          if ($text) {
            $body += '## 更新内容'
            $body += ''
            $body += $text
          } else {
            # 没有 CHANGELOG 也要说清楚"上哪看改了什么"，别只留一句"没找到说明"
            $body += '## 更新内容'
            $body += ''
            $body += "本次发布（$tag）没有在 `CHANGELOG.md` 里找到对应小节的说明。"
            $body += '改动清单请看仓库的提交记录。'
          }

          $body += ''
          $body += '---'
          $body += ''
          $body += '## 下载'
          $body += ''
          # 用单引号拼接，别在双引号里塞反引号 —— PowerShell 双引号字符串里
          # 反引号是转义符，跟 markdown 的行内代码标记会打架。
          #
          # ⚠️ 拼接那一项**必须加括号**。PowerShell 里**逗号的优先级比 `+` 高**，
          #    写成 `'a' + $x + 'b', 'c', 'd'` 会被解析成
          #    `'a' + $x + ('b', 'c', 'd')` —— 后面整串被并成一个字符串，
          #    于是整个「下载」小节塌成一行、空行全丢（而且**不报错**）。
          #    加个括号才是"先拼好，再当一个数组元素"。
          #
          # ⚠️ 这一节是**两个包**的说明，别退回成一个。判据里最要紧的是那句
          #    **粗暴判据**（"不确定就下小的"）：用户站在 Release 页上只会看前两行，
          #    写成参数对比表他反而不知道点哪个。装运行时的官方链接也放在这里 ——
          #    小包跑不起来时 Windows 也会弹一个带官方安装指引的框（apphost 的既有行为，
          #    **本项目没有实测过**"没装运行时的机器"那种情形），把链接写在正文里
          #    是为了让用户不用去别处找。
          $body += @(
            '**两个包，随便下哪个都能用。** 区别只有一个：要不要先装 .NET 运行时。',
            '',
            ('- 🟢 **`' + $zip + '`**（' + $sizeFx + '，**主推 / 不确定就下这个**）'),
            '  已经装过 .NET 10 桌面运行时的人下这个 —— 体积只有另一个的零头。',
            ('- 🔵 **`' + $zipSc + '`**（' + $sizeSc + '，备用 / 零依赖）'),
            '  不想装任何东西的人下这个 —— 自带运行时，解压双击就跑。',
            '',
            '**怎么选（粗暴判据）**：不确定就**先下小的**。双击打得开就完事了；',
            '**打不开、或者弹窗说要装 .NET，就回来下那个 `-selfcontained` 的大包** ——',
            '那个不需要装任何东西。',
            '',
            '想装运行时（装一次，以后每个版本都下小的）：',
            '官方下载页 <https://dotnet.microsoft.com/download/dotnet/10.0>，',
            '要的是 **.NET Desktop Runtime 10.0**（x64）—— 注意**不是** SDK，',
            '也**不是** ASP.NET Core Runtime。',
            '',
            '两个包都是**解压出来就一个 `Mosslight.exe`**，双击即可：',
            '',
            '- 语言数据（5 种）已经编在 exe 里面了，**不用再带别的文件**',
            '- 想改翻译的话（可选）：在 `Mosslight.exe` 旁边放一份',
            '  `Assets\lang\xx.json` 就能覆盖对应的那一种语言 —— 不放就都用内置的',
            '- 配置默认写在 `%APPDATA%\Mosslight\`；想让它待在 exe 旁边，',
            '  就在同目录建一个空的 `portable.txt`',
            '',
            '> 需要 64 位 Windows 10 1809 及以上。',
            '',
            '---',
            ''
          )
          if ($prev) {
            $body += "**完整变更**：https://github.com/$repo/compare/$prev...$tag"
            $body += ''
          }

          # 正文写两步：先落到 RUNNER_TEMP，确认写出来了，再挪进仓库根目录。
          #
          # ⚠️ 为什么不直接 `Set-Content RELEASE_BODY.md`：
          #    那个文件是**提交进版本库**的兜底正文。直接写的话，一旦写到一半失败
          #    （磁盘满、路径被占），仓库里那份兜底也被截断了 —— 偏偏这时候最需要它。
          #    先写临时文件再 Move-Item（同盘改名，原子），写失败时仓库里那份**原样还在**。
          #
          # ⚠️ 为什么不用 `Set-Content -Encoding UTF8`：
          #    同一个参数在 PowerShell 7 是**无 BOM**、在 5.1 是**带 BOM**。
          #    带 BOM 的后果不是"多三个字节"这么简单：GitHub 渲染正文时 BOM 会粘在
          #    第一个 `##` 前面，**标题就不成标题了**（整份正文从第一行开始烂）。
          #    这里显式指定 UTF8Encoding($false)，两个版本行为一致。
          [System.IO.File]::WriteAllText(
            $env:TMP_BODY, ($body -join "`n"), (New-Object System.Text.UTF8Encoding($false)))
          if (-not (Test-Path $env:TMP_BODY)) { throw "发行说明没写出来：$($env:TMP_BODY)" }
          Move-Item -Force $env:TMP_BODY 'RELEASE_BODY.md'
          Write-Host '---- 发行说明 ----'
          # ⚠️ `-Encoding UTF8` 不能省（回显用的，不影响写文件）：
          #    上面写出来的是**无 BOM** 的 UTF-8。`Get-Content` 不带 -Encoding 时，
          #    PowerShell 5.1 会按**本地 ANSI**（简中机器上是 GBK）去解码无 BOM 的文件，
          #    日志里整段正文变成乱码 —— 那是**回显**乱码，文件本身是好的
          #    （GitHub 上 `shell: pwsh` 是 7，默认就按 UTF-8 读，所以只有本地
          #     `local_run_workflow.py` 会看见；但"日志里全是乱码"很容易被当成
          #    "正文写坏了"，白查一轮）。
          Get-Content 'RELEASE_BODY.md' -Encoding UTF8

      # 保险丝第三层：上面那一步真失败了，就把 body_path 退回仓库里那份通用说明
      # （`continue-on-error` 会把 outcome 记成 failure，但 conclusion 还是 success，
      #  所以这一步照跑）。
      - name: 检查发行说明（决定 Release 用哪一份正文）
        # always()：前面的步骤失败也要跑这一下 —— 它的作用就是"失败时"给个明确的话。
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path 'RELEASE_BODY.md')) {
            # 走到这儿说明仓库里连兜底正文都没有（文件被删了？）
            Write-Host "::warning::RELEASE_BODY.md 不存在 —— Release 会是空正文"
          } elseif ((Get-Item 'RELEASE_BODY.md').Length -lt 200) {
            # 正常生成的那份有一两千字节；这么小说明上面那步只写了一半就挂了，
            # 剩下的还是仓库里提交的兜底内容（或者干脆是空的）
            Write-Host "::warning::RELEASE_BODY.md 只有 $((Get-Item 'RELEASE_BODY.md').Length) 字节，可能没生成完整"
          } else {
            Write-Host "发行说明就绪：$((Get-Item 'RELEASE_BODY.md').Length) 字节"
          }

      - name: 建 Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          # 手动触发时这个 tag 不存在，action 会在当前提交上创建它
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Mosslight Launcher 2 ${{ steps.ver.outputs.tag }}"
          # ⚠️ 这个路径必须在建 Release **之前**就存在：
          #    action-gh-release 遇到读不到的 body_path 是直接报错，不会回退到别的正文
          #    （见 softprops/action-gh-release#664）。所以不能写成
          #    `${{ runner.temp }}\RELEASE_BODY.md` 一个死路径 ——
          #    上面那一步失败时它就不存在，Release 反而建不出来。
          #    这里固定用仓库根目录这份：正常路径下"组装发行说明"会把它覆盖成
          #    带本次更新内容 + 真实 zip 名的正文，失败时它就是一份提交进版本库的
          #    通用说明（不写死任何版本号），两种情况都有正文。
          body_path: RELEASE_BODY.md
          # **两个包都上传**。只列其中一个的话，另一个包在 Release 上根本不存在 ——
          # 而正文里写着"两个包，随便下哪个都能用"，用户会以为是自己看漏了。
          # 用块标量（每行一个），不是逗号分隔的一行：文件名里以后真要出现逗号也不至于被拆开。
          #
          # ⚠️ 这两行里的名字来自上一步写进 GITHUB_ENV 的 ZIP / ZIP_SC，
          #    跟"组装发行说明"和 "打 zip" 用的是同一份值 —— 不要把 zip 名在这里
          #    再手写一遍，手写的那份迟早跟实际产物对不上。
          files: |
            ${{ env.ZIP }}
            ${{ env.ZIP_SC }}
          draft: false
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
          # zip 名对不上时直接红，别悄悄发一个没有附件的 Release
          # （action 的默认值是 fail_on_unmatched_files: false）。
          # 两个包都列上之后这一条更要紧：任何一个名字写歪都会当场红，
          # 而不是"发出来只有一个小包、没人发现大包没传上去"。
          fail_on_unmatched_files: true
