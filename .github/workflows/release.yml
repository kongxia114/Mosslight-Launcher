# ============================================================================
#  发版：出 Release
#
#  两种触发方式：
#
#    1. 推 tag（推荐，版本号跟着 tag 走）
#         git tag v2.0.0 && git push origin v2.0.0
#
#    2. 手动点（Actions → Release → Run workflow，填个版本号）
#         想重发一次、或者从某个分支直接发而不想打 tag 时用
#
#  两种方式跑的是**同一套步骤** —— 刻意没有拆成两个文件：拆开之后
#  "改了 release.yml 忘了改 manual-release.yml"是迟早的事（1.0.0 那边就是两份）。
#
#  产物：一个 zip（自带 .NET 运行时的单文件 exe + Assets/），解压双击就能跑。
# ============================================================================

name: Release

on:
  push:
    tags:
      - 'v*'          # 只匹配 v2.0.0 / v2.0.0-beta 这类 tag

  workflow_dispatch:
    inputs:
      version:
        description: '版本号（必须带 v 前缀，如 v2.0.0）'
        required: true
        # ⚠️ 刻意**不给 default**。1.0.0 那份写死了 'v1.0.0' 当默认值，
        #    还得靠一句注释提醒"每次发版顺手改这两行"—— 手一滑就把上一次的
        #    版本号发出去了。必填 + 空默认，逼着人每次自己敲一遍。
      prerelease:
        description: '标记为预发布版（beta / alpha / rc）'
        type: boolean
        default: false

# ⚠️ 必须给 contents: write，否则创建 Release 会 403。
#    GitHub 从 2023 起把默认 GITHUB_TOKEN 收成了只读，不写这一行就白跑一趟。
permissions:
  contents: write

# 同一个 tag 重复推 / 手动重跑时，别让两个 job 同时改同一个 Release
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  # 关掉 .NET 的"首次运行体验"（Welcome 消息 + 后台遥测）：
  # 不关的话 CI 日志开头会多一大段，首次 dotnet 命令还要多等几秒
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

jobs:
  release:
    # ⚠️ 必须是 windows runner：这是 WPF（net10.0-windows），
    #    Linux 容器里连编译都过不去。
    runs-on: windows-latest

    steps:
      # ⚠️ fetch-depth: 0 是必须的。默认只拉 1 个提交**且不带 tag**，
      #    而发行说明最后要 `git describe` 找上一个 tag 来生成 compare 链接 ——
      #    浅克隆下那个命令会失败，链接就没了（不报错，只是悄悄少一行）。
      - name: 取源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 出问题时这一屏信息最值钱（SDK 版本、装了哪些 runtime）
      - name: 环境信息
        run: dotnet --info

      # ----------------------------------------------------------------------
      #  版本号：**以 tag（或手动输入）为准**，不认源码里写死的那个
      # ----------------------------------------------------------------------
      - name: 归一化版本号
        id: ver
        # ⚠️ `shell: pwsh` 不能省，也不能改成 `powershell`。
        #    下面用 `>> $env:GITHUB_OUTPUT` 传值：PowerShell 7 的 `>>` 写 UTF-8，
        #    而 Windows PowerShell 5.1 的 `>>` 默认写 **UTF-16LE** ——
        #    GitHub 按 UTF-8 去读就会解析不出任何 output（而且是静默的，
        #    下一步只会看到空字符串）。凡是要写 GITHUB_OUTPUT/GITHUB_ENV 的
        #    步骤，都必须显式声明 pwsh。
        shell: pwsh
        run: |
          $isManual = '${{ github.event_name }}' -eq 'workflow_dispatch'
          $tag = if ($isManual) { '${{ inputs.version }}'.Trim() } else { '${{ github.ref_name }}' }

          if (-not $tag) { throw "版本号是空的。" }
          # `-p:Version=` 要的是合法版本号，不能带前缀的 v；
          # 而 Release 名字和 zip 文件名沿用带 v 的 tag（跟 1.0.0 的产物命名一致）。
          $num = $tag -replace '^v', ''
          if ($num -notmatch '^\d+\.\d+') {
            throw "版本号 '$tag' 不像版本号。请用 v2.0.0 / v2.0.0-beta 这种写法。"
          }

          # 预发布标记：手动走输入框，tag 走名字里有没有 beta/alpha/rc
          $pre = if ($isManual) {
            '${{ inputs.prerelease }}' -eq 'true'
          } else {
            $tag -match '(beta|alpha|rc)'
          }

          "tag=$tag"               >> $env:GITHUB_OUTPUT
          "num=$num"               >> $env:GITHUB_OUTPUT
          "prerelease=$($pre.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "版本号 = $num（tag $tag），预发布 = $pre"

      # ----------------------------------------------------------------------
      #  把版本号写进 AppInfo.AppVersion
      # ----------------------------------------------------------------------
      #  ⚠️ 为什么非要改源码：`AppInfo.AppVersion` 是 **const string**，
      #     侧边栏左下角和 About 页显示的就是它。只传 `-p:Version=` 的话，
      #     exe 属性里的版本号对了，但**启动器界面上还写着旧的**（v2.0.0-alpha）——
      #     正式版显示成 alpha，这种事不该发生。
      #
      #  ⚠️ 匹配不到就直接抛错，**不静默跳过**：不然哪天有人重构了 AppInfo.cs，
      #     这一步会一声不响地什么都不做，然后带着错误版本号发出去。
      - name: 用版本号覆盖 AppInfo.AppVersion
        shell: pwsh
        run: |
          $path = 'Mosslight.Core/AppInfo.cs'
          if (-not (Test-Path $path)) { throw "找不到 $path" }

          $text = [System.IO.File]::ReadAllText($path)
          $pattern = 'public const string AppVersion = "[^"]*";'
          if ($text -notmatch $pattern) {
            throw "$path 里找不到 AppVersion 那一行 —— 是不是重构过了？"
          }

          $new = 'public const string AppVersion = "${{ steps.ver.outputs.tag }}";'
          $text = $text -replace $pattern, $new
          # 显式写 UTF-8 **不带 BOM**：源码里全是中文注释，
          # 编码搞错会把它们变成乱码（而且编译器不一定报错）
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))

          Select-String -Path $path -Pattern 'AppVersion'

      # ----------------------------------------------------------------------
      #  构建
      # ----------------------------------------------------------------------
      - name: 还原
        run: dotnet restore "Mosslight-Launcher 2.0.slnx" -m:1

      # `-m:1` 是跟本地保持一致的保守写法：README 里记着开发机的并行还原会崩
      # （`_GetAllRestoreProjectPathItems` 直接"生成失败"、还不给错误信息）。
      # CI 上未必复现，但单线程构建多花不了几秒，不值得为它冒险。
      #
      # `-warnaserror` 让警告也拦门禁 —— 这个工程目前是 0 警告，能保持住。
      - name: 构建
        run: dotnet build "Mosslight-Launcher 2.0.slnx" -c Release --no-restore -m:1 -warnaserror

      # ----------------------------------------------------------------------
      #  自检（门禁）
      # ----------------------------------------------------------------------
      #  金标准（tests/*.json）和 fixture（tests/fixtures）都是**提交进仓库**的，
      #  所以 CI 这里不需要 Python。
      #
      #  ⚠️ 别在这里加 `python tools/gen_launch_golden.py`：那个脚本靠
      #     `D:\开发工程\DHML-src`（1.0.0 的源码）当权威，CI 上没有那个目录。
      #     它是**本地**改完引擎之后重新生成金标准用的，不是 CI 步骤。
      - name: 自检（离线金标准比对）
        shell: pwsh
        run: |
          $exe = 'Mosslight.Core.SelfCheck\bin\Release\net10.0-windows\Mosslight.Core.SelfCheck.exe'
          if (-not (Test-Path $exe)) { throw "自检没编出来：$exe" }
          & $exe 'tests\theme_golden.json'
          if ($LASTEXITCODE -ne 0) { throw "自检没过（退出码 $LASTEXITCODE）—— 别发这个版本" }

      # ----------------------------------------------------------------------
      #  界面冒烟：真的把窗口渲染一遍
      # ----------------------------------------------------------------------
      #  ⚠️ **每一页都要截**，不能只截首页 —— 这个门禁是真抓过东西的：
      #     · 账户页外层 Grid 少声明了一行，页脚 `Grid.Row="4"` 越界，
      #       WPF **不报错**、把它塞回最后一行，结果文字叠在标题上；
      #     · 设置页的 `Slider.ValueChanged` 在 XAML **解析期**就触发，
      #       那时后面的 x:Name 控件还没建出来 → 构造期 NullReferenceException。
      #     两个都是"编译 0 警告、跑起来才炸"，而且都不在首页上。
      #
      #  截图模式是**离屏渲染**（RenderTargetBitmap，不 Show 窗口），
      #  所以不需要显示器。哪天 runner 真的没有桌面会话了，
      #  要放宽的就是这一步 —— 加 `continue-on-error: true` 即可，
      #  别的步骤都跟图形环境无关。
      - name: 界面冒烟（每页离屏渲染一张截图）
        shell: pwsh
        run: |
          $exe = 'Mosslight.App\bin\Release\net10.0-windows\win-x64\Mosslight.exe'
          if (-not (Test-Path $exe)) { throw "界面没编出来：$exe" }

          $dir = Join-Path $env:RUNNER_TEMP 'smoke'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          $failed = @()
          foreach ($page in 'home','personalize','accounts','settings','versions','mods','download','download:loader','download:modpack','versionsettings','versionsettings:advanced','versionsettings:mods') {
            # ⚠️ 文件名里的 `:` 换成 `-`：Windows 上文件名不能带冒号，
            #    `versionsettings:advanced.png` 会直接建不出来。
            $shot = Join-Path $dir "$($page -replace ':', '-').png"
            $p = Start-Process -FilePath $exe `
                               -ArgumentList '--page',$page,'--screenshot',$shot,'--settle','5000' `
                               -PassThru -Wait
            if ($p.ExitCode -ne 0) { $failed += "$page（退出码 $($p.ExitCode)）"; continue }
            if (-not (Test-Path $shot)) { $failed += "$page（没截出图）"; continue }
            # 一张 1280x820 的正常截图有几十 KB；几百字节说明是白板
            $len = (Get-Item $shot).Length
            if ($len -lt 5000) { $failed += "$page（只有 $len 字节，像白板）"; continue }
            Write-Host "  $page OK：$len 字节"
          }

          if ($failed.Count -gt 0) { throw "这些页面没渲染出来：$($failed -join '、')" }
          "SHOTDIR=$dir" >> $env:GITHUB_ENV

      # 发布出问题时能直接看图，不用本地复现
      - name: 留档截图
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: ${{ env.SHOTDIR }}
          retention-days: 7

      # ----------------------------------------------------------------------
      #  打包
      # ----------------------------------------------------------------------
      #  三个决定，都是有理由的：
      #
      #  1. **self-contained**（把 .NET 运行时一起打进去）。
      #     框架依赖版只有 1 MB，但要求用户先装 .NET 10 Desktop Runtime ——
      #     对一个"Minecraft 启动器"来说这是不能接受的下载门槛。
      #     代价是 zip 约 60 MB。
      #
      #  2. **PublishSingleFile + EnableCompressionInSingleFile**。
      #     压缩后 ~60 MB（不压 ~150 MB）。启动时要把自己解到临时目录，
      #     所以会比散装慢一点点，换来"解压出来就一个 exe"的观感。
      #
      #  3. **IncludeNativeLibrariesForSelfExtract=true 不能省**。
      #     WPF 有原生库（wpfgfx / PresentationNative）。不加这个的话
      #     它们会作为**散装 dll 落在 exe 旁边** —— 单文件就白做了。
      #
      #  ⚠️ 为什么不学 1.0.0 再发一个 "onefile.exe"：
      #     这个工程的**语言文件是散装的**（`Assets/lang/*.json`，
      #     Localizer 从 exe 旁边的 Assets 目录读）。单个 exe 拿不到它们，
      #     界面上会全部退回中文兜底。所以产物必须是
      #     `Mosslight.exe + Assets/` 这个组合，只能打成 zip。
      - name: 发布（self-contained 单文件）
        shell: pwsh
        run: |
          $out = 'publish'
          dotnet publish 'Mosslight.App\Mosslight.App.csproj' `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=${{ steps.ver.outputs.num }} `
            -p:FileVersion=${{ steps.ver.outputs.num }} `
            -o $out -m:1
          if ($LASTEXITCODE -ne 0) { throw "发布失败（退出码 $LASTEXITCODE）" }

          # .pdb 不进发布包：用户用不上，而且带着它等于把源码路径也发出去了
          Get-ChildItem $out -Filter *.pdb -Recurse | Remove-Item -Force

          # 语言文件必须躺在 exe 旁边 —— Localizer 是从 BaseDirectory\Assets\lang 读的。
          # 少了它**不会报任何错**，只是所有语言都退回中文（包括英文/日文用户），
          # 所以这里硬性检查一下。
          if (-not (Test-Path "$out\Assets\lang\zh_CN.json")) {
            throw "发布产物里缺 Assets\lang —— 界面会全部退回中文兜底"
          }

          Get-ChildItem $out -Recurse -File |
            Select-Object @{n='文件';e={$_.FullName.Replace((Resolve-Path $out).Path + '\','')}},
                          @{n='KB';e={[math]::Round($_.Length/1KB)}}

      - name: 打 zip
        shell: pwsh
        run: |
          $name = "Mosslight-2.0-${{ steps.ver.outputs.tag }}-win64.zip"
          Compress-Archive -Path 'publish\*' -DestinationPath $name -Force
          $mb = [math]::Round((Get-Item $name).Length / 1MB, 1)
          Write-Host "$name（$mb MB）"
          "ZIP=$name" >> $env:GITHUB_ENV

      # 就算 Release 那步出问题，也能从 Actions 页面把包下下来
      - name: 留档安装包
        uses: actions/upload-artifact@v4
        with:
          name: Mosslight-2.0-win64
          path: ${{ env.ZIP }}
          retention-days: 14

      # ----------------------------------------------------------------------
      #  发行说明
      # ----------------------------------------------------------------------
      #  CHANGELOG.md 有对应小节就用它，没有就写一句提示 —— **不因为缺文件而失败**。
      #  找法跟 1.0.0 一致（先精确匹配版本号，再退回「未发布」/「Unreleased」），
      #  这样平时只要往「未发布」里追加内容就行。
      - name: 组装发行说明
        shell: pwsh
        run: |
          $tag  = "${{ steps.ver.outputs.tag }}"
          $zip  = $env:ZIP
          $repo = $env:GITHUB_REPOSITORY

          # 上一个 tag：`<当前tag>^` = "当前 tag 之前的那一个提交"。
          # 不加 ^ 的话 describe 会返回自己，compare 链接就成了空 diff。
          $prev = (git describe --tags --abbrev=0 --match 'v*' "$tag^" 2>$null)
          $text = ''

          if (Test-Path CHANGELOG.md) {
            $sections = [ordered]@{}
            $current = $null
            foreach ($line in (Get-Content CHANGELOG.md -Encoding UTF8)) {
              if ($line -match '^##\s+(.+)$') {
                $current = $matches[1].Trim()
                $sections[$current] = @()
                continue
              }
              if ($current) { $sections[$current] += $line }
            }
            foreach ($key in @($tag, ($tag -replace '^v',''), '未发布', 'Unreleased')) {
              if ($sections.Contains($key)) {
                # 先剥掉 HTML 注释再判断有没有内容：「未发布」那节平时只放一句
                # 说明用的注释，不剥掉的话它会被当成正文（markdown 里看不见，
                # 但会占着位置，让"这版没写说明"走不到下面的提示）
                $candidate = (($sections[$key] -join "`n") -replace '(?s)<!--.*?-->', '').Trim()
                if ($candidate) { $text = $candidate; break }
              }
            }
          }

          $body = @()
          if ($text) {
            $body += '## 更新内容'
            $body += ''
            $body += $text
          } else {
            $body += "本次没有在 CHANGELOG.md 里找到 $tag 的说明。"
          }

          $body += ''
          $body += '---'
          $body += ''
          $body += '## 下载'
          $body += ''
          # 用单引号拼接，别在双引号里塞反引号 —— PowerShell 双引号字符串里
          # 反引号是转义符，跟 markdown 的行内代码标记会打架。
          #
          # ⚠️ 拼接那一项**必须加括号**。PowerShell 里**逗号的优先级比 `+` 高**，
          #    写成 `'a' + $x + 'b', 'c', 'd'` 会被解析成
          #    `'a' + $x + ('b', 'c', 'd')` —— 后面整串被并成一个字符串，
          #    于是整个「下载」小节塌成一行、空行全丢（而且**不报错**）。
          #    加个括号才是"先拼好，再当一个数组元素"。
          $body += @(
            ('**`' + $zip + '`** —— 解压到任意目录，双击 `Mosslight.exe`。'),
            '',
            '- 自带 .NET 运行时，**不需要另外装任何东西**',
            '- 解压后 `Mosslight.exe` 要和 `Assets\` 放在一起，别只把 exe 拷出去',
            '- 配置默认写在 `%APPDATA%\Mosslight\`；想让它待在 exe 旁边，',
            '  就在同目录建一个空的 `portable.txt`',
            '',
            '> 需要 64 位 Windows 10 1809 及以上。',
            '',
            '---',
            ''
          )
          if ($prev) {
            $body += "**完整变更**：https://github.com/$repo/compare/$prev...$tag"
          }

          # ⚠️ 发行说明里全是中文，编码写错 GitHub 上就是一串问号。
          #    pwsh 的 -Encoding UTF8 是**无 BOM** 的 UTF-8，正合适。
          $body -join "`n" | Set-Content RELEASE_BODY.md -Encoding UTF8
          Write-Host '---- 发行说明 ----'
          Get-Content RELEASE_BODY.md

      - name: 建 Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          # 手动触发时这个 tag 不存在，action 会在当前提交上创建它
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Mosslight Launcher 2.0 ${{ steps.ver.outputs.tag }}"
          body_path: RELEASE_BODY.md
          files: ${{ env.ZIP }}
          draft: false
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
